<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>라이브캠 지도 데모</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.css" />
<link href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.3.0/dist/maplibre-gl.css" rel="stylesheet" />
<style>
  :root{
    --bg: #0a0e14;
    --panel: #10151d;
    --line: #1e2733;
    --text: #e8edf3;
    --text-dim: #7d8a9a;
    --accent: #4fb3ff;
    --accent-glow: rgba(79,179,255,0.55);
    --live-red: #ff4d5e;
    --cctv-color: #ffb020;
    --mono: 'SF Mono', 'Consolas', 'Menlo', monospace;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%; width:100%;
    background:var(--bg); color:var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Pretendard', 'Malgun Gothic', sans-serif;
    overflow:hidden;
  }
  body, #map, .topbar, .style-switch, .add-btn, .count-pill,
  .list-panel, .panel, .hint, .pick-hint {
    -webkit-user-select: none;
    user-select: none;
  }
  .list-head input,
  .modal-box input,
  .modal-box textarea,
  .panel-body,
  .code-result pre {
    -webkit-user-select: text;
    user-select: text;
  }
  #map{ position:absolute; inset:0; background:var(--bg); }
  .leaflet-container{ background:var(--bg); }
  .dark-tiles{
    filter: invert(1) hue-rotate(180deg) brightness(0.85) contrast(0.9) saturate(0.6);
  }
  .topbar{
    position:absolute; top:0; left:0; right:0; z-index:1000;
    display:flex; align-items:center; gap:10px;
    padding:16px 18px; pointer-events:none; flex-wrap:wrap;
  }
  .brand{ display:flex; flex-direction:column; gap:2px; pointer-events:auto; }
  .brand .kicker{
    font-family:var(--mono); font-size:10px; letter-spacing:0.18em;
    color:var(--accent); text-transform:uppercase;
  }
  .brand .title{ font-size:15px; font-weight:600; color:var(--text); letter-spacing:-0.01em; }
  .count-pill{
    margin-left:auto; pointer-events:auto;
    background:var(--panel); border:1px solid var(--line);
    border-radius:20px; padding:7px 14px;
    font-family:var(--mono); font-size:11px; color:var(--text-dim);
    display:flex; align-items:center; gap:6px;
  }
  .count-pill b{ color:var(--text); font-weight:600; }
  .count-pill .dot{
    width:6px; height:6px; border-radius:50%; background:var(--live-red);
    box-shadow:0 0 6px var(--live-red); animation: blink 1.6s ease-in-out infinite;
  }
  @keyframes blink{ 0%,100%{opacity:1;} 50%{opacity:0.25;} }
  .cam-marker{
    width:20px; height:20px; border-radius:50%; background:var(--accent);
    border:2px solid #0a0e14;
    box-shadow:0 0 0 4px var(--accent-glow), 0 0 14px var(--accent-glow);
    cursor:pointer; transition: transform 0.15s ease;
  }
  .cam-marker:hover{ transform:scale(1.25); }
  .cam-marker.active{
    background:#ffb020;
    box-shadow:0 0 0 5px rgba(255,176,32,0.5), 0 0 18px rgba(255,176,32,0.6);
  }
  .cctv-marker{
    width:12px; height:12px; border-radius:50%; background:var(--cctv-color);
    border:1.5px solid #0a0e14;
    box-shadow:0 0 0 3px rgba(255,176,32,0.35), 0 0 8px rgba(255,176,32,0.5);
    cursor:pointer;
  }
  .cctv-marker.active{
    background:#ff4d5e;
    box-shadow:0 0 0 4px rgba(255,77,94,0.45), 0 0 10px rgba(255,77,94,0.6);
  }
  .marker-cluster-custom{
    background:rgba(255,176,32,0.25); border:1px solid rgba(255,176,32,0.6);
    border-radius:50%; display:flex; align-items:center; justify-content:center;
    color:#0a0e14; font-weight:700; font-size:12px;
  }
  .marker-cluster-custom span{
    background:var(--cctv-color); width:100%; height:100%; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
  }
  .leaflet-tooltip.cam-tip{
    background:var(--panel); border:1px solid var(--line);
    color:var(--text); font-size:12px; font-weight:600;
    padding:6px 10px; border-radius:8px; box-shadow:0 4px 16px rgba(0,0,0,0.45);
  }
  .leaflet-tooltip.cam-tip::before{ border-top-color:var(--line); }
  .panel{
    position:absolute; z-index:1100; background:var(--panel);
    border:1px solid var(--line); box-shadow: 0 -8px 40px rgba(0,0,0,0.5);
    display:flex; flex-direction:column;
    transform: translateY(110%);
    transition: transform 0.32s cubic-bezier(.2,.9,.25,1);
    overflow-x:hidden;
  }
  @media (min-width: 720px){
    .panel{
      top:16px; right:16px; bottom:16px; width:380px;
      min-width:280px; max-width:min(1600px, 96vw);
      border-radius:14px; transform: translateX(120%);
    }
    .panel.open{ transform: translateX(0); }
  }
  @media (max-width: 719px){
    .panel{ left:0; right:0; bottom:0; height:58%; border-radius:16px 16px 0 0; }
    .panel.open{ transform: translateY(0); }
    .panel-resize{ display:none; }
  }
  .panel-resize{
    position:absolute; left:0; top:0; bottom:0; width:8px; cursor:ew-resize; z-index:20;
  }
  .panel-resize::after{
    content:''; position:absolute; left:2px; top:50%; transform:translateY(-50%);
    width:3px; height:40px; border-radius:2px; background:var(--line); opacity:0.6;
    transition: background 0.15s, opacity 0.15s;
  }
  .panel-resize:hover::after,
  .panel.resizing .panel-resize::after{ background:var(--accent); opacity:1; }
  .panel-head{
    display:flex; align-items:center; gap:10px;
    padding:14px 16px; border-bottom:1px solid var(--line); flex-shrink:0;
  }
  .live-badge{
    display:flex; align-items:center; gap:5px;
    background:rgba(255,77,94,0.12); border:1px solid rgba(255,77,94,0.35);
    color:var(--live-red); font-family:var(--mono); font-size:10px;
    font-weight:700; letter-spacing:0.08em; padding:3px 8px; border-radius:20px;
  }
  .live-badge .dot{
    width:5px; height:5px; border-radius:50%; background:var(--live-red);
    animation: blink 1.4s ease-in-out infinite;
  }
  .panel-title{
    font-size:14px; font-weight:600; flex:1;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .panel-close{
    background:none; border:none; color:var(--text-dim);
    font-size:18px; cursor:pointer; padding:4px 6px; line-height:1; border-radius:6px;
  }
  .panel-close:hover{ background:var(--line); color:var(--text); }
  .video-wrap{
    position:relative; width:100%; aspect-ratio:16/9;
    background:#000; flex-shrink:0; overflow:hidden;
  }
  .video-wrap iframe, .video-wrap video{
    position:absolute; inset:0; width:100%; height:100%; border:0; max-width:100%;
  }
  .video-footer{
    display:none; align-items:center; justify-content:flex-end;
    padding:8px 12px; border-top:1px solid var(--line); background:var(--panel); flex-shrink:0;
  }
  .video-footer a{
    font-size:12px; font-weight:600; color:var(--accent);
    text-decoration:none; padding:6px 12px; border-radius:8px;
    border:1px solid rgba(79,179,255,0.35); background:rgba(79,179,255,0.08);
  }
  .video-footer a:hover{ background:rgba(79,179,255,0.16); }
  .video-state{
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:8px; color:var(--text-dim); font-size:12.5px; text-align:center; padding:14px;
    background:#05070a;
  }
  .video-state .spin{
    width:22px; height:22px; border:2px solid var(--line); border-top-color:var(--accent);
    border-radius:50%; animation: sp 0.7s linear infinite;
  }
  @keyframes sp{ to{ transform:rotate(360deg); } }
  .panel-body{
    padding:14px 16px; overflow-y:auto; overflow-x:hidden;
    font-size:12.5px; color:var(--text-dim); line-height:1.6;
  }
  .panel-body .loc{ color:var(--text); font-weight:600; font-size:13px; margin-bottom:4px; }
  .panel-body .src{
    font-family:var(--mono); font-size:10.5px; color:#4d5a6a; margin-top:8px;
    word-break:break-all; overflow-wrap:anywhere;
  }
  .hint{
    position:absolute; left:50%; bottom:20px; transform:translateX(-50%);
    z-index:900; pointer-events:none;
    background:var(--panel); border:1px solid var(--line);
    padding:8px 14px; border-radius:20px; font-size:11.5px; color:var(--text-dim);
    opacity:1; transition:opacity 0.4s ease;
  }
  .hint.hidden{ opacity:0; }
  .leaflet-control-zoom{ border:1px solid var(--line) !important; margin-top:70px !important; }
  .leaflet-control-zoom a{
    background:var(--panel) !important; color:var(--text) !important; border-color:var(--line) !important;
  }
  .leaflet-control-zoom a:hover{ background:var(--line) !important; }
  .leaflet-control-attribution{
    background:rgba(10,14,20,0.75) !important; color:var(--text-dim) !important; font-size:9px !important;
  }
  .leaflet-control-attribution a{ color:var(--accent) !important; }
  .style-switch{
    position:absolute; left:16px; bottom:20px; z-index:900;
    display:flex; gap:2px; background:var(--panel); border:1px solid var(--line);
    border-radius:12px; padding:3px; box-shadow:0 6px 24px rgba(0,0,0,0.4);
  }
  .style-switch button{
    appearance:none; border:none; background:transparent;
    color:var(--text-dim); font-size:11.5px; font-weight:600;
    padding:7px 12px; border-radius:9px; cursor:pointer; font-family:inherit;
    letter-spacing:-0.01em; transition: background 0.15s ease, color 0.15s ease;
  }
  .style-switch button:hover{ color:var(--text); }
  .style-switch button.active{ background:var(--accent); color:#0a0e14; }
  .add-btn{
    pointer-events:auto; display:flex; align-items:center; gap:6px;
    background:var(--panel); border:1px solid var(--line);
    color:var(--text); font-size:12px; font-weight:600;
    padding:8px 14px; border-radius:20px; cursor:pointer; font-family:inherit;
  }
  .add-btn:hover{ border-color:var(--accent); color:var(--accent); }
  .add-btn.active{ background:var(--accent); color:#0a0e14; border-color:var(--accent); }
  #cctvBtn.active{ background:var(--cctv-color); color:#0a0e14; border-color:var(--cctv-color); }
  #map.picking{ cursor:crosshair; }
  .pick-hint{
    position:absolute; top:64px; left:50%; transform:translateX(-50%);
    z-index:950; background:var(--accent); color:#0a0e14;
    font-size:12px; font-weight:600; padding:8px 16px; border-radius:20px;
    display:none; box-shadow:0 6px 20px rgba(79,179,255,0.35);
  }
  .pick-hint.show{ display:block; }
  .temp-marker{
    width:22px; height:22px; border-radius:50%; background:#ff8a1e; border:2px solid #0a0e14;
    box-shadow:0 0 0 5px rgba(255,138,30,0.45), 0 0 16px rgba(255,138,30,0.6);
  }
  .modal-overlay{
    position:absolute; inset:0; z-index:1300; background:rgba(5,7,10,0.55);
    display:none; align-items:center; justify-content:center; padding:20px;
  }
  .modal-overlay.show{ display:flex; }
  .modal-box{
    width:100%; max-width:380px; background:var(--panel); border:1px solid var(--line);
    border-radius:14px; padding:18px; box-shadow:0 20px 60px rgba(0,0,0,0.6);
  }
  .modal-box h3{ margin:0 0 4px; font-size:15px; color:var(--text); }
  .modal-box .coord{ font-family:var(--mono); font-size:11px; color:var(--text-dim); margin-bottom:14px; }
  .field{ margin-bottom:12px; }
  .field label{ display:block; font-size:11.5px; color:var(--text-dim); margin-bottom:5px; }
  .field input, .field textarea{
    width:100%; background:#0a0e14; border:1px solid var(--line);
    color:var(--text); font-size:13px; padding:9px 10px; border-radius:8px;
    font-family:inherit; resize:none;
  }
  .field input:focus, .field textarea:focus{ outline:none; border-color:var(--accent); }
  .field .err{ color:var(--live-red); font-size:11px; margin-top:5px; display:none; }
  .field .err.show{ display:block; }
  .modal-actions{ display:flex; gap:8px; margin-top:4px; }
  .modal-actions button{
    flex:1; padding:10px; border-radius:8px; border:none;
    font-size:13px; font-weight:600; cursor:pointer; font-family:inherit;
  }
  .btn-cancel{ background:var(--line); color:var(--text-dim); }
  .btn-cancel:hover{ color:var(--text); }
  .btn-generate{ background:var(--accent); color:#0a0e14; }
  .btn-generate:hover{ filter:brightness(1.08); }
  .code-result{ margin-top:14px; display:none; }
  .code-result.show{ display:block; }
  .code-result pre{
    background:#05070a; border:1px solid var(--line); border-radius:8px;
    padding:10px; font-family:var(--mono); font-size:10.5px; color:#9fd6ff;
    white-space:pre-wrap; word-break:break-all; margin:0 0 8px;
    max-height:120px; overflow-y:auto;
  }
  .btn-copy{
    width:100%; background:transparent; border:1px solid var(--accent);
    color:var(--accent); padding:9px; border-radius:8px; font-size:12.5px;
    font-weight:600; cursor:pointer; font-family:inherit;
  }
  .btn-copy:hover{ background:rgba(79,179,255,0.1); }
  .btn-copy.copied{ background:var(--accent); color:#0a0e14; }
  .list-panel{
    position:absolute; z-index:1150; background:var(--panel); border:1px solid var(--line);
    display:flex; flex-direction:column; box-shadow: 8px 0 40px rgba(0,0,0,0.5);
    transform: translateX(-110%); transition: transform 0.3s cubic-bezier(.2,.9,.25,1);
  }
  @media (min-width: 720px){
    .list-panel{ top:16px; left:16px; bottom:16px; width:300px; border-radius:14px; }
    .list-panel.open{ transform:translateX(0); }
  }
  @media (max-width: 719px){
    .list-panel{ top:0; left:0; bottom:0; width:82%; max-width:320px; border-radius:0 16px 16px 0; }
    .list-panel.open{ transform:translateX(0); }
  }
  .list-head{
    display:flex; align-items:center; gap:8px;
    padding:14px 14px; border-bottom:1px solid var(--line); flex-shrink:0;
  }
  .list-head input{
    flex:1; background:#0a0e14; border:1px solid var(--line);
    color:var(--text); font-size:13px; padding:8px 10px; border-radius:8px; font-family:inherit;
  }
  .list-head input:focus{ outline:none; border-color:var(--accent); }
  .list-items{ list-style:none; margin:0; padding:6px; overflow-y:auto; flex:1; }
  .list-items li{
    padding:9px 10px; border-radius:8px; cursor:pointer;
    font-size:13px; color:var(--text); display:flex; align-items:center; gap:8px;
  }
  .list-items li:hover{ background:var(--line); }
  .list-items li .tag{
    width:7px; height:7px; border-radius:50%; flex-shrink:0; background:var(--accent);
  }
  .list-items li.is-cctv .tag{ background:var(--cctv-color); }
  .list-items li .nm{ flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .list-items li .viewers{
    flex-shrink:0; font-family:var(--mono); font-size:11px;
    color:var(--text-dim); min-width:3.2em; text-align:right;
  }
  .list-items li .viewers.has-count{ color:var(--accent); }
  .list-empty{ padding:16px 12px; color:var(--text-dim); font-size:12px; text-align:center; }
</style>
</head>
<body>
<div id="map"></div>
<div class="topbar">
  <div class="brand">
    <div class="kicker">Live Cam Map · Demo</div>
    <div class="title">실시간 카메라 지도</div>
  </div>
  <button class="add-btn" id="listBtn">☰ 목록</button>
  <button class="add-btn" id="cctvBtn">📹 국도 CCTV</button>
  <button class="add-btn" id="addBtn">+ 카메라 추가</button>
  <div class="count-pill"><span class="dot"></span>등록 <b id="camCount">0</b>개</div>
</div>
<div class="pick-hint" id="pickHint">지도를 클릭해 카메라 위치를 선택하세요 (취소: 버튼 다시 클릭)</div>
<div class="hint" id="hint">지도 위 점을 눌러보세요</div>
<div class="style-switch" id="styleSwitch">
  <button data-style="dark" class="active">다크</button>
  <button data-style="clean">한글</button>
  <button data-style="satellite">위성</button>
</div>
<div class="list-panel" id="listPanel">
  <div class="list-head">
    <input type="text" id="listSearch" placeholder="카메라 이름 검색">
    <button class="panel-close" id="listClose">✕</button>
  </div>
  <ul class="list-items" id="listItems"></ul>
</div>
<div class="panel" id="panel">
  <div class="panel-resize" id="panelResize"></div>
  <div class="panel-head">
    <span class="live-badge"><span class="dot"></span>LIVE</span>
    <div class="panel-title" id="panelTitle">-</div>
    <button class="panel-close" id="panelClose">✕</button>
  </div>
  <div class="video-wrap" id="videoWrap"></div>
  <div class="video-footer" id="videoFooter">
    <a id="openTabBtn" href="#" target="_blank" rel="noopener noreferrer">새 탭에서 열기 ↗</a>
  </div>
  <div class="panel-body">
    <div class="loc" id="panelLoc">-</div>
    <div id="panelDesc">-</div>
    <div class="src" id="panelSrc">-</div>
  </div>
</div>
<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box">
    <h3>카메라 추가</h3>
    <div class="coord" id="modalCoord">-</div>
    <div class="field">
      <label>이름</label>
      <input type="text" id="fName" placeholder="예: 해운대 해수욕장">
    </div>
    <div class="field">
      <label>영상 링크</label>
      <input type="text" id="fUrl" placeholder="유튜브 링크 또는 라이브 리다이렉트 링크(https://...)">
      <div class="err" id="fUrlErr">링크를 인식하지 못했어요. http(s)로 시작하는 주소인지 확인해주세요.</div>
    </div>
    <div class="field">
      <label>설명 (선택)</label>
      <textarea id="fDesc" rows="2" placeholder="예: 해운대 해변가 실시간 화면"></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" id="modalCancel">취소</button>
      <button class="btn-generate" id="modalGenerate">코드 생성</button>
    </div>
    <div class="code-result" id="codeResult">
      <pre id="codeText"></pre>
      <button class="btn-copy" id="btnCopy">코드 복사</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.17/hls.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.3.0/dist/maplibre-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@maplibre/maplibre-gl-leaflet/leaflet-maplibre-gl.js"></script>

  function createStyleLayer(name) {
    const s = styles[name];
    if (s.type === 'maptiler-raster') {
      if (!MAPTILER_KEY) return createCartoLayer();
      if (typeof L.maplibreGL !== 'function') return createCartoLayer();
      const gl = L.maplibreGL({
        style: `https://api.maptiler.com/maps/streets-v2/style.json?key=${MAPTILER_KEY}`,
        attribution: '<a href="https://www.maptiler.com/copyright/" target="_blank">&copy; MapTiler</a> <a href="https://www.openstreetmap.org/copyright" target="_blank">&copy; OpenStreetMap contributors</a>',
      });
      gl.on('add', () => {
        const mMap = gl.getMaplibreMap();
        const applyLang = () => { if (typeof mMap.setLanguage === 'function') mMap.setLanguage('ko'); };
        if (mMap.isStyleLoaded && mMap.isStyleLoaded()) applyLang();
        else mMap.once('load', applyLang);
      });
      return gl;
    }
    return L.tileLayer(s.url, s.options);
  }

  const ITS_API_KEY = 'f9565bfc1f2b4a68a26c48120f5c27b3';

  const ITS_MIN_ZOOM = 11;

  function itsUrl(bounds){
    const p = new URLSearchParams({
      apiKey: ITS_API_KEY, type: 'all', cctvType: '1',
      minX: bounds.getWest(), maxX: bounds.getEast(),
      minY: bounds.getSouth(), maxY: bounds.getNorth(), getType: 'json',
    });
    return `${ITS_ENDPOINT}?${p.toString()}`;
  }
  async function loadCctvInView(){
    if(!cctvOn || cctvLoading) return;
    if(map.getZoom() < ITS_MIN_ZOOM){ cctvLayer.clearLayers(); updateCount(); return; }
    cctvLoading = true;
    try{
      const res = await fetch(itsUrl(map.getBounds()));
      if(!res.ok) throw new Error('http ' + res.status);
      const data = await res.json();
      const list = (data.response && data.response.data) || [];
      cctvLayer.clearLayers();

        const icon = L.divIcon({ className: 'cctv-marker', iconSize: [12,12] });

      videoWrap.innerHTML = '<div class="video-state">이 카메라는 스트림 주소가 없습니다</div>';
    }else{
      videoWrap.innerHTML += '<video id="cctvVideo" muted playsinline></video>';
      const video = document.getElementById('cctvVideo');
      const state = document.getElementById('cctvState');
      if(window.Hls && Hls.isSupported()){
        activeHls = new Hls();
        activeHls.loadSource(streamUrl);
        activeHls.attachMedia(video);
        activeHls.on(Hls.Events.MANIFEST_PARSED, () => { state?.remove(); video.play().catch(()=>{}); });
        activeHls.on(Hls.Events.ERROR, (_, d) => {
          if(d.fatal) {
            videoWrap.innerHTML = '<div class="video-state">이 카메라는 지금 재생할 수 없습니다<br><span style="font-size:11px;opacity:.7">HTTPS 미지원 또는 스트림 오류일 수 있습니다</span></div>';
          }
        });
      }else if(video.canPlayType('application/vnd.apple.mpegurl')){
        video.src = streamUrl;
        video.addEventListener('loadedmetadata', () => state?.remove());
        video.play().catch(()=>{});
      }else{
        videoWrap.innerHTML = '<div class="video-state">이 브라우저에서는 재생할 수 없습니다</div>';
      }
    }
    panel.classList.add('open');
    hint.classList.add('hidden');
  }
  function toggleCctv(){
    cctvOn = !cctvOn;
    document.getElementById('cctvBtn').classList.toggle('active', cctvOn);
    if(cctvOn){ map.addLayer(cctvLayer); loadCctvInView(); }
    else { map.removeLayer(cctvLayer); cctvLayer.clearLayers(); updateCount(); }
  }
  document.getElementById('cctvBtn').addEventListener('click', toggleCctv);
  map.on('moveend', () => { if(cctvOn) loadCctvInView(); });

  const listPanel = document.getElementById('listPanel');
  const listItems = document.getElementById('listItems');
  const listSearch = document.getElementById('listSearch');

  function formatViewers(n) {
    if (n == null || n === '') return '-';
    const num = Number(n);
    if (!Number.isFinite(num)) return '-';
    return num.toLocaleString('ko-KR') + '명';
  }

  function parseLiveRedirect(url) {
    try {
      const u = new URL(url);
      if (!/live-redirect/i.test(u.href)) return null;
      const channel = u.searchParams.get('channel');
      const keyword = (u.searchParams.get('keyword') || '').trim();
      if (!channel) return null;
      return { channel, keyword };
    } catch (_) {
      return null;
    }
  }

  async function resolveChannelId(channelParam) {
    if (!YOUTUBE_API_KEY) return null;
    const handle = String(channelParam).replace(/^@/, '').trim();
    if (!handle) return null;
    const cacheKey = '@' + handle;
    if (channelIdCache.has(cacheKey)) return channelIdCache.get(cacheKey);
    try {
      let res = await fetch(
        'https://www.googleapis.com/youtube/v3/channels?part=id&forHandle=' +
          encodeURIComponent(handle) +
          '&key=' + encodeURIComponent(YOUTUBE_API_KEY)
      );
      if (res.ok) {
        const data = await res.json();
        const id = data.items && data.items[0] && data.items[0].id;
        if (id) {
          channelIdCache.set(cacheKey, id);
          return id;
        }
      }
      res = await fetch(
        'https://www.googleapis.com/youtube/v3/search?part=snippet&type=channel&maxResults=1&q=' +
          encodeURIComponent('@' + handle) +
          '&key=' + encodeURIComponent(YOUTUBE_API_KEY)
      );
      if (!res.ok) return null;
      const data = await res.json();
      const item = data.items && data.items[0];
      const id = item && (item.snippet && item.snippet.channelId
        ? item.snippet.channelId
        : (item.id && item.id.channelId));
      if (id) channelIdCache.set(cacheKey, id);
      return id || null;
    } catch (e) {
      console.warn('channelId 조회 실패', handle, e.message);
      return null;
    }
  }

  async function resolveVideoIdFromLiveRedirect(externalUrl) {
    const parsed = parseLiveRedirect(externalUrl);
    if (!parsed || !YOUTUBE_API_KEY) return null;
    const cacheKey = parsed.channel + '|' + parsed.keyword;
    const cached = videoIdCache.get(cacheKey);
    if (cached && Date.now() - cached.ts < 5 * 60_000) return cached.videoId;

    const channelId = await resolveChannelId(parsed.channel);
    if (!channelId) return null;
    try {
      let api =
        'https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&eventType=live&maxResults=5&channelId=' +
        encodeURIComponent(channelId) +
        '&key=' + encodeURIComponent(YOUTUBE_API_KEY);
      if (parsed.keyword) api += '&q=' + encodeURIComponent(parsed.keyword);
      const res = await fetch(api);
      if (!res.ok) throw new Error('search ' + res.status);
      const data = await res.json();
      const items = data.items || [];
      if (!items.length) {
        videoIdCache.set(cacheKey, { videoId: null, ts: Date.now() });
        return null;
      }
      let chosen = items[0];
      if (parsed.keyword) {
        const kw = parsed.keyword.toLowerCase();
        const hit = items.find(it =>
          ((it.snippet && it.snippet.title) || '').toLowerCase().includes(kw)
        );
        if (hit) chosen = hit;
      }
      const videoId = chosen.id && chosen.id.videoId;
      videoIdCache.set(cacheKey, { videoId: videoId || null, ts: Date.now() });
      return videoId || null;
    } catch (e) {
      console.warn('live-redirect videoId 해석 실패', e.message);
      return null;
    }
  }

  async function resolveCamVideoId(cam) {
    if (cam.videoId) return cam.videoId;
    if (cam.externalUrl) return resolveVideoIdFromLiveRedirect(cam.externalUrl);
    return null;
  }

  async function fetchConcurrentViewers(videoId) {
    if (!videoId || !YOUTUBE_API_KEY) return null;
    const cached = viewerCache.get(videoId);
    if (cached && Date.now() - cached.ts < 60_000) return cached.count;
    try {
      const url =
        'https://www.googleapis.com/youtube/v3/videos?part=liveStreamingDetails&id=' +
        encodeURIComponent(videoId) +
        '&key=' + encodeURIComponent(YOUTUBE_API_KEY);
      const res = await fetch(url);
      if (!res.ok) throw new Error('yt ' + res.status);
      const data = await res.json();
      const item = data.items && data.items[0];
      const raw = item && item.liveStreamingDetails && item.liveStreamingDetails.concurrentViewers;
      const count = raw != null ? Number(raw) : null;
      viewerCache.set(videoId, { count, ts: Date.now() });
      return count;
    } catch (e) {
      console.warn('시청자 수 조회 실패', videoId, e.message);
      return null;
    }
  }

  async function renderList(filterText){
    const q = (filterText || '').trim().toLowerCase();
    listItems.innerHTML = '';
    let count = 0;
    const filtered = cams.filter(c => !q || c.name.toLowerCase().includes(q));

    for (const c of filtered) {
      const li = document.createElement('li');
      li.innerHTML =
        `<span class="tag"></span>` +
        `<span class="nm">${c.name}</span>` +
        `<span class="viewers">…</span>`;
      li.addEventListener('click', () => {
        map.flyTo([c.lat, c.lng], 15, { duration: 0.6 });
        const marker = camMarkers.get(c);
        if(marker) openCam(c, marker);
        listPanel.classList.remove('open');
      });
      listItems.appendChild(li);
      count++;
    }

    if(cctvOn){
      cctvLayer.eachLayer(marker => {
        const ll = marker.getLatLng();
        const name = marker._cctvName || 'CCTV';
        if(q && !name.toLowerCase().includes(q)) return;
        const li = document.createElement('li');
        li.className = 'is-cctv';
        li.innerHTML =
          `<span class="tag"></span>` +
          `<span class="nm">${name}</span>` +
          `<span class="viewers">-</span>`;
        li.addEventListener('click', () => {
          map.flyTo(ll, Math.max(map.getZoom(), 15), { duration: 0.6 });
          marker.fire('click');
          listPanel.classList.remove('open');
        });
        listItems.appendChild(li);
        count++;
      });
    }

    if(!count){
      listItems.innerHTML = '<li class="list-empty" style="cursor:default">검색 결과가 없습니다</li>';
      return;
    }

    const rows = listItems.querySelectorAll('li:not(.is-cctv)');
    for (let i = 0; i < rows.length && i < filtered.length; i++) {
      const el = rows[i].querySelector('.viewers');
      if (!el) continue;
      const cam = filtered[i];
      const vid = await resolveCamVideoId(cam);
      if (!vid) {
        el.textContent = '-';
        continue;
      }
      const n = await fetchConcurrentViewers(vid);
      el.textContent = formatViewers(n);
      if (n != null) el.classList.add('has-count');
    }
  }

  document.getElementById('listBtn').addEventListener('click', () => {
    listPanel.classList.toggle('open');
    if(listPanel.classList.contains('open')) renderList(listSearch.value);
  });
  document.getElementById('listClose').addEventListener('click', () => listPanel.classList.remove('open'));
  listSearch.addEventListener('input', () => renderList(listSearch.value));

  const addBtn = document.getElementById('addBtn');
  const pickHint = document.getElementById('pickHint');
  const mapEl = document.getElementById('map');
  const modalOverlay = document.getElementById('modalOverlay');
  const modalCoord = document.getElementById('modalCoord');
  const codeResult = document.getElementById('codeResult');
  const codeText = document.getElementById('codeText');
  const btnCopy = document.getElementById('btnCopy');
  let pickMode = false;
  let pickedLatLng = null;
  let tempMarker = null;

  function togglePickMode(force){
    pickMode = force !== undefined ? force : !pickMode;
    addBtn.classList.toggle('active', pickMode);
    pickHint.classList.toggle('show', pickMode);
    mapEl.classList.toggle('picking', pickMode);
  }
  addBtn.addEventListener('click', () => togglePickMode());
  map.on('click', (e) => {
    if(!pickMode) return;
    pickedLatLng = e.latlng;
    if(tempMarker) map.removeLayer(tempMarker);
    tempMarker = L.marker(e.latlng, { icon: L.divIcon({ className:'temp-marker', iconSize:[22,22] }) }).addTo(map);
    modalCoord.textContent = `위도 ${e.latlng.lat.toFixed(6)}, 경도 ${e.latlng.lng.toFixed(6)}`;
    document.getElementById('fName').value = '';
    document.getElementById('fUrl').value = '';
    document.getElementById('fDesc').value = '';
    document.getElementById('fUrlErr').classList.remove('show');
    codeResult.classList.remove('show');
    modalOverlay.classList.add('show');
    togglePickMode(false);
  });

  function extractYoutubeId(input){
    input = input.trim();
    if(/^[a-zA-Z0-9_-]{11}$/.test(input)) return input;
    const patterns = [
      /(?:youtube\.com\/watch\?v=)([a-zA-Z0-9_-]{11})/,
      /(?:youtu\.be\/)([a-zA-Z0-9_-]{11})/,
      /(?:youtube\.com\/live\/)([a-zA-Z0-9_-]{11})/,
      /(?:youtube\.com\/embed\/)([a-zA-Z0-9_-]{11})/,
      /[?&]v=([a-zA-Z0-9_-]{11})/,
    ];
    for(const re of patterns){
      const m = input.match(re);
      if(m) return m[1];
    }
    return null;
  }

  document.getElementById('modalCancel').addEventListener('click', closeModal);
  function closeModal(){
    modalOverlay.classList.remove('show');
    if(tempMarker){ map.removeLayer(tempMarker); tempMarker = null; }
  }
  document.getElementById('modalGenerate').addEventListener('click', () => {
    const name = document.getElementById('fName').value.trim() || '이름 없는 카메라';
    const urlRaw = document.getElementById('fUrl').value.trim();
    const desc = document.getElementById('fDesc').value.trim() || '설명 없음';
    const vid = extractYoutubeId(urlRaw);
    const errEl = document.getElementById('fUrlErr');
    let camData;
    if(vid){
      camData = { name, lat: Number(pickedLatLng.lat.toFixed(6)), lng: Number(pickedLatLng.lng.toFixed(6)), videoId: vid, desc };
    } else if(/^https?:\/\//i.test(urlRaw)){
      camData = { name, lat: Number(pickedLatLng.lat.toFixed(6)), lng: Number(pickedLatLng.lng.toFixed(6)), externalUrl: urlRaw, desc };
    } else {
      errEl.classList.add('show');
      return;
    }
    errEl.classList.remove('show');
    const snippet = camData.videoId
      ? `{ name: "${name.replace(/"/g,'\\"')}", lat: ${camData.lat}, lng: ${camData.lng}, videoId: "${camData.videoId}", desc: "${desc.replace(/"/g,'\\"')}" },`
      : `{ name: "${name.replace(/"/g,'\\"')}", lat: ${camData.lat}, lng: ${camData.lng}, externalUrl: "${camData.externalUrl.replace(/"/g,'\\"')}", desc: "${desc.replace(/"/g,'\\"')}" },`;
    codeText.textContent = snippet;
    codeResult.classList.add('show');
    addCamMarker(camData);
    cams.push(camData);
    updateCount();
  });
  btnCopy.addEventListener('click', async () => {
    try{
      await navigator.clipboard.writeText(codeText.textContent);
      btnCopy.textContent = '복사됨 ✓';
      btnCopy.classList.add('copied');
      setTimeout(() => { btnCopy.textContent = '코드 복사'; btnCopy.classList.remove('copied'); }, 1600);
    }catch(err){
      btnCopy.textContent = '복사 실패 — 직접 선택해 복사하세요';
    }
  });

  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    if (modalOverlay.classList.contains('show')) { closeModal(); return; }
    if (panel.classList.contains('open')) { closeCam(); return; }
    if (listPanel.classList.contains('open')) listPanel.classList.remove('open');
  });

  (function initPanelResize() {
    const panelEl = document.getElementById('panel');
    const handle = document.getElementById('panelResize');
    if (!panelEl || !handle) return;
    const STORAGE_KEY = 'livecam-panel-width';
    const MIN_W = 280;
    const MAX_W = () => Math.min(1600, window.innerWidth * 0.96);
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      const w = Math.min(MAX_W(), Math.max(MIN_W, parseInt(saved, 10)));
      panelEl.style.width = w + 'px';
    }
    let startX = 0, startW = 0;
    function onMove(e) {
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const next = Math.min(MAX_W(), Math.max(MIN_W, startW + (startX - clientX)));
      panelEl.style.width = next + 'px';
    }
    function onUp() {
      panelEl.classList.remove('resizing');
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
      document.removeEventListener('touchmove', onMove);
      document.removeEventListener('touchend', onUp);
      localStorage.setItem(STORAGE_KEY, parseInt(panelEl.style.width, 10) || 380);
    }
    function onDown(e) {
      e.preventDefault();
      startX = e.touches ? e.touches[0].clientX : e.clientX;
      startW = panelEl.getBoundingClientRect().width;
      panelEl.classList.add('resizing');
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
      document.addEventListener('touchmove', onMove, { passive: false });
      document.addEventListener('touchend', onUp);
    }
    handle.addEventListener('mousedown', onDown);
    handle.addEventListener('touchstart', onDown, { passive: false });
  })();

  updateCount();
</script>
