<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>라이브캠 지도 데모</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.css" />
<link href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.3.0/dist/maplibre-gl.css" rel="stylesheet" />
<style>
  :root{
    --bg: #0a0e14; --panel: #10151d; --line: #1e2733; --text: #e8edf3;
    --text-dim: #7d8a9a; --accent: #4fb3ff; --accent-glow: rgba(79,179,255,0.55);
    --live-red: #ff4d5e; --cctv-color: #ffb020;
    --mono: 'SF Mono', 'Consolas', 'Menlo', monospace;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%; width:100%;
    background:var(--bg); color:var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Pretendard', 'Malgun Gothic', sans-serif;
    overflow:hidden;
  }
  body, #map, .topbar, .style-switch, .add-btn, .count-pill,
  .list-panel, .panel, .hint, .pick-hint { -webkit-user-select:none; user-select:none; }
  .list-head input, .modal-box input, .modal-box textarea, .panel-body, .code-result pre {
    -webkit-user-select:text; user-select:text;
  }
  #map{ position:absolute; inset:0; background:var(--bg); }
  .leaflet-container{ background:var(--bg); }
  .dark-tiles{ filter: invert(1) hue-rotate(180deg) brightness(0.85) contrast(0.9) saturate(0.6); }
  .topbar{
    position:absolute; top:0; left:0; right:0; z-index:1000;
    display:flex; align-items:center; gap:10px;
    padding:16px 18px; pointer-events:none; flex-wrap:wrap;
  }
  .brand{ display:flex; flex-direction:column; gap:2px; pointer-events:auto; }
  .brand .kicker{ font-family:var(--mono); font-size:10px; letter-spacing:0.18em; color:var(--accent); text-transform:uppercase; }
  .brand .title{ font-size:15px; font-weight:600; letter-spacing:-0.01em; }
  .topbar-actions{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-left:auto; pointer-events:auto; }
  .count-pill{
    background:var(--panel); border:1px solid var(--line); border-radius:20px; padding:7px 14px;
    font-family:var(--mono); font-size:11px; color:var(--text-dim);
    display:flex; align-items:center; gap:6px; flex-shrink:0;
  }
  .count-pill b{ color:var(--text); font-weight:600; }
  .count-pill .dot{
    width:6px; height:6px; border-radius:50%; background:var(--live-red);
    box-shadow:0 0 6px var(--live-red); animation:blink 1.6s ease-in-out infinite;
  }
  @keyframes blink{ 0%,100%{opacity:1;} 50%{opacity:0.25;} }
  .cam-marker{
    width:20px; height:20px; border-radius:50%; background:var(--accent); border:2px solid #0a0e14;
    box-shadow:0 0 0 4px var(--accent-glow), 0 0 14px var(--accent-glow);
    cursor:pointer; transition:transform 0.15s ease;
  }
  .cam-marker:hover{ transform:scale(1.25); }
  .cam-marker.active{ background:#ffb020; box-shadow:0 0 0 5px rgba(255,176,32,0.5), 0 0 18px rgba(255,176,32,0.6); }
  .cctv-marker{
    width:12px; height:12px; border-radius:50%; background:var(--cctv-color); border:1.5px solid #0a0e14;
    box-shadow:0 0 0 3px rgba(255,176,32,0.35); cursor:pointer;
  }
  .cctv-marker.active{ background:#ff4d5e; }
  .marker-cluster-custom{
    background:rgba(255,176,32,0.25); border:1px solid rgba(255,176,32,0.6);
    border-radius:50%; display:flex; align-items:center; justify-content:center;
    color:#0a0e14; font-weight:700; font-size:12px;
  }
  .marker-cluster-custom span{
    background:var(--cctv-color); width:100%; height:100%; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
  }
  .leaflet-tooltip.cam-tip{
    background:var(--panel); border:1px solid var(--line); color:var(--text);
    font-size:12px; font-weight:600; padding:6px 10px; border-radius:8px;
  }
  .leaflet-tooltip.cam-tip::before{ border-top-color:var(--line); }
  .panel{
    position:absolute; z-index:1100; background:var(--panel); border:1px solid var(--line);
    box-shadow:0 -8px 40px rgba(0,0,0,0.5); display:flex; flex-direction:column;
    transform:translateY(110%); transition:transform 0.32s cubic-bezier(.2,.9,.25,1); overflow-x:hidden;
  }
  @media (min-width:720px){
    .panel{ top:16px; right:16px; bottom:16px; width:380px; min-width:280px;
      max-width:min(1600px,96vw); border-radius:14px; transform:translateX(120%); }
    .panel.open{ transform:translateX(0); }
  }
  @media (max-width:719px){
    .panel{ left:0; right:0; bottom:0; height:58%; border-radius:16px 16px 0 0; }
    .panel.open{ transform:translateY(0); }
    .panel-resize{ display:none; }
    .topbar{ padding:10px 10px 8px; gap:6px; align-items:flex-start; }
    .brand .kicker{ font-size:9px; }
    .brand .title{ font-size:13px; }
    .topbar-actions{ margin-left:0; width:100%; flex-wrap:nowrap; overflow-x:auto; gap:6px;
      -webkit-overflow-scrolling:touch; padding-bottom:2px; }
    .topbar-actions::-webkit-scrollbar{ display:none; }
    .add-btn{ padding:6px 10px; font-size:11px; border-radius:16px; flex-shrink:0; }
    .count-pill{ padding:6px 10px; font-size:10px; }
    .leaflet-control-zoom{ margin-top:96px !important; }
    .pick-hint{ top:88px; font-size:11px; max-width:92vw; text-align:center; }
    .style-switch{ left:10px; bottom:16px; padding:2px; }
    .style-switch button{ padding:6px 10px; font-size:11px; }
  }
  .panel-resize{ position:absolute; left:0; top:0; bottom:0; width:8px; cursor:ew-resize; z-index:20; }
  .panel-resize::after{
    content:''; position:absolute; left:2px; top:50%; transform:translateY(-50%);
    width:3px; height:40px; border-radius:2px; background:var(--line); opacity:0.6;
  }
  .panel-resize:hover::after, .panel.resizing .panel-resize::after{ background:var(--accent); opacity:1; }
  .panel-head{
    display:flex; align-items:center; gap:10px; padding:14px 16px;
    border-bottom:1px solid var(--line); flex-shrink:0;
  }
  .live-badge{
    display:flex; align-items:center; gap:5px; background:rgba(255,77,94,0.12);
    border:1px solid rgba(255,77,94,0.35); color:var(--live-red);
    font-family:var(--mono); font-size:10px; font-weight:700; padding:3px 8px; border-radius:20px;
  }
  .live-badge .dot{ width:5px; height:5px; border-radius:50%; background:var(--live-red); animation:blink 1.4s ease-in-out infinite; }
  .panel-title{ font-size:14px; font-weight:600; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .panel-close{ background:none; border:none; color:var(--text-dim); font-size:18px; cursor:pointer; padding:4px 6px; border-radius:6px; }
  .panel-close:hover{ background:var(--line); color:var(--text); }
  .video-wrap{ position:relative; width:100%; aspect-ratio:16/9; background:#000; flex-shrink:0; overflow:hidden; }
  .video-wrap iframe, .video-wrap video{ position:absolute; inset:0; width:100%; height:100%; border:0; }
  .video-footer{
    display:none; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap;
    padding:8px 12px; border-top:1px solid var(--line); flex-shrink:0;
  }
  .video-footer .viewers-label{ font-family:var(--mono); font-size:11px; color:var(--accent); }
  .video-footer .footer-actions{ display:flex; gap:6px; align-items:center; margin-left:auto; }
  .video-footer a, .video-footer button.btn-refresh{
    font-size:12px; font-weight:600; color:var(--accent); text-decoration:none;
    padding:6px 12px; border-radius:8px; border:1px solid rgba(79,179,255,0.35);
    background:rgba(79,179,255,0.08); cursor:pointer; font-family:inherit;
  }
  .video-footer button.btn-refresh:disabled{ opacity:0.5; cursor:wait; }
  .video-state{
    position:absolute; inset:0; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:8px; color:var(--text-dim); font-size:12.5px; background:#05070a;
  }
  .video-state .spin{
    width:22px; height:22px; border:2px solid var(--line); border-top-color:var(--accent);
    border-radius:50%; animation:sp 0.7s linear infinite;
  }
  @keyframes sp{ to{ transform:rotate(360deg); } }
  .panel-body{ padding:14px 16px; overflow-y:auto; font-size:12.5px; color:var(--text-dim); line-height:1.6; }
  .panel-body .loc{ color:var(--text); font-weight:600; font-size:13px; margin-bottom:4px; }
  .panel-body .src{ font-family:var(--mono); font-size:10.5px; color:#4d5a6a; margin-top:8px; word-break:break-all; }
  .hint{
    position:absolute; left:50%; bottom:20px; transform:translateX(-50%); z-index:900;
    pointer-events:none; background:var(--panel); border:1px solid var(--line);
    padding:8px 14px; border-radius:20px; font-size:11.5px; color:var(--text-dim);
  }
  .hint.hidden{ opacity:0; }
  .leaflet-control-zoom{ border:1px solid var(--line) !important; margin-top:70px !important; }
  .leaflet-control-zoom a{ background:var(--panel) !important; color:var(--text) !important; border-color:var(--line) !important; }
  .leaflet-control-attribution{ background:rgba(10,14,20,0.75) !important; color:var(--text-dim) !important; font-size:9px !important; }
  .style-switch{
    position:absolute; left:16px; bottom:20px; z-index:900; display:flex; gap:2px;
    background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:3px;
  }
  .style-switch button{
    appearance:none; border:none; background:transparent; color:var(--text-dim);
    font-size:11.5px; font-weight:600; padding:7px 12px; border-radius:9px; cursor:pointer; font-family:inherit;
  }
  .style-switch button.active{ background:var(--accent); color:#0a0e14; }
  .add-btn{
    display:flex; align-items:center; gap:6px; background:var(--panel); border:1px solid var(--line);
    color:var(--text); font-size:12px; font-weight:600; padding:8px 14px; border-radius:20px;
    cursor:pointer; font-family:inherit;
  }
  .add-btn:hover{ border-color:var(--accent); color:var(--accent); }
  .add-btn.active{ background:var(--accent); color:#0a0e14; }
  #cctvBtn.active{ background:var(--cctv-color); color:#0a0e14; }
  #map.picking{ cursor:crosshair; }
  .pick-hint{
    position:absolute; top:64px; left:50%; transform:translateX(-50%); z-index:950;
    background:var(--accent); color:#0a0e14; font-size:12px; font-weight:600;
    padding:8px 16px; border-radius:20px; display:none;
  }
  .pick-hint.show{ display:block; }
  .temp-marker{
    width:22px; height:22px; border-radius:50%; background:#ff8a1e; border:2px solid #0a0e14;
    box-shadow:0 0 0 5px rgba(255,138,30,0.45);
  }
  .modal-overlay{
    position:absolute; inset:0; z-index:1300; background:rgba(5,7,10,0.55);
    display:none; align-items:center; justify-content:center; padding:20px;
  }
  .modal-overlay.show{ display:flex; }
  .modal-box{
    width:100%; max-width:380px; background:var(--panel); border:1px solid var(--line);
    border-radius:14px; padding:18px;
  }
  .modal-box h3{ margin:0 0 4px; font-size:15px; }
  .modal-box .coord{ font-family:var(--mono); font-size:11px; color:var(--text-dim); margin-bottom:14px; }
  .field{ margin-bottom:12px; }
  .field label{ display:block; font-size:11.5px; color:var(--text-dim); margin-bottom:5px; }
  .field input, .field textarea{
    width:100%; background:#0a0e14; border:1px solid var(--line); color:var(--text);
    font-size:13px; padding:9px 10px; border-radius:8px; font-family:inherit; resize:none;
  }
  .field .err{ color:var(--live-red); font-size:11px; margin-top:5px; display:none; }
  .field .err.show{ display:block; }
  .modal-actions{ display:flex; gap:8px; }
  .modal-actions button{ flex:1; padding:10px; border-radius:8px; border:none; font-size:13px; font-weight:600; cursor:pointer; font-family:inherit; }
  .btn-cancel{ background:var(--line); color:var(--text-dim); }
  .btn-generate{ background:var(--accent); color:#0a0e14; }
  .code-result{ margin-top:14px; display:none; }
  .code-result.show{ display:block; }
  .code-result pre{
    background:#05070a; border:1px solid var(--line); border-radius:8px; padding:10px;
    font-family:var(--mono); font-size:10.5px; color:#9fd6ff; white-space:pre-wrap; word-break:break-all;
    max-height:120px; overflow-y:auto; margin:0 0 8px;
  }
  .btn-copy{
    width:100%; background:transparent; border:1px solid var(--accent); color:var(--accent);
    padding:9px; border-radius:8px; font-size:12.5px; font-weight:600; cursor:pointer; font-family:inherit;
  }
  .list-panel{
    position:absolute; z-index:1150; background:var(--panel); border:1px solid var(--line);
    display:flex; flex-direction:column; transform:translateX(-110%);
    transition:transform 0.3s cubic-bezier(.2,.9,.25,1); box-shadow:8px 0 40px rgba(0,0,0,0.5);
  }
  @media (min-width:720px){
    .list-panel{ top:16px; left:16px; bottom:16px; width:320px; border-radius:14px; }
    .list-panel.open{ transform:translateX(0); }
  }
  @media (max-width:719px){
    .list-panel{ top:0; left:0; bottom:0; width:86%; max-width:340px; border-radius:0 16px 16px 0; }
    .list-panel.open{ transform:translateX(0); }
  }
  .list-head{ display:flex; flex-direction:column; gap:8px; padding:12px 14px; border-bottom:1px solid var(--line); flex-shrink:0; }
  .list-head-row{ display:flex; align-items:center; gap:8px; width:100%; }
  .list-head input{
    flex:1; background:#0a0e14; border:1px solid var(--line); color:var(--text);
    font-size:13px; padding:8px 10px; border-radius:8px; font-family:inherit;
  }
  .list-meta{ font-family:var(--mono); font-size:10px; color:var(--text-dim); line-height:1.4; }
  .list-meta.ok{ color:#6dce9a; }
  .list-meta.warn{ color:#ffb020; }
  .list-items{ list-style:none; margin:0; padding:6px; overflow-y:auto; flex:1; }
  .list-items li{
    padding:9px 8px; border-radius:8px; cursor:pointer; font-size:13px;
    display:flex; align-items:center; gap:6px;
  }
  .list-items li:hover{ background:var(--line); }
  .list-items li .tag{ width:7px; height:7px; border-radius:50%; flex-shrink:0; background:var(--accent); }
  .list-items li.is-cctv .tag{ background:var(--cctv-color); }
  .list-items li .nm{ flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; }
  .list-items li .viewers{
    flex-shrink:0; font-family:var(--mono); font-size:11px; color:var(--text-dim);
    min-width:2.8em; text-align:right;
  }
  .list-items li .viewers.has-count{ color:var(--accent); }

  /* 목록 마우스 호버 라이브 미리보기 */
  .list-hover-preview{
    position:fixed;
    z-index:10050;
    width:360px;
    height:203px;
    background:#000;
    border:1px solid rgba(255,255,255,.18);
    border-radius:10px;
    overflow:hidden;
    box-shadow:0 12px 35px rgba(0,0,0,.55);
    pointer-events:none;
    opacity:0;
    transform:scale(.98);
    transition:opacity .12s ease, transform .12s ease;
  }
  .list-hover-preview.show{
    opacity:1;
    transform:scale(1);
  }
  .list-hover-preview iframe{
    width:100%;
    height:100%;
    border:0;
    display:block;
    background:#000;
    pointer-events:none;
  }
  .list-items li .viewers.status-text{ font-size:9px; min-width:auto; white-space:nowrap; }
  .list-items li .btn-rid{
    flex-shrink:0; font-size:10px; padding:4px 7px; border-radius:6px;
    border:1px solid var(--line); background:transparent; color:var(--text-dim);
    cursor:pointer; font-family:inherit;
  }
  .list-items li .btn-rid:hover{ border-color:var(--accent); color:var(--accent); }
  .list-items li .btn-rid:disabled{ opacity:0.5; cursor:wait; }
  .list-empty{ padding:16px 12px; color:var(--text-dim); font-size:12px; text-align:center; }
</style>
</head>
<body>
<div id="map"></div>
<div class="topbar">
  <div class="brand">
    <div class="kicker">Live Cam Map · Demo</div>
    <div class="title">실시간 카메라 지도</div>
  </div>
  <div class="topbar-actions">
    <button class="add-btn" id="listBtn">☰ 목록</button>
    <button class="add-btn" id="cctvBtn">📹 CCTV</button>
    <button class="add-btn" id="addBtn">+ 추가</button>
    <div class="count-pill"><span class="dot"></span><b id="camCount">0</b></div>
  </div>
</div>
<div class="pick-hint" id="pickHint">지도를 클릭해 카메라 위치를 선택하세요</div>
<div class="hint" id="hint">지도 위 점을 눌러보세요</div>
<div class="style-switch" id="styleSwitch">
  <button data-style="dark" class="active">다크</button>
  <button data-style="clean">한글</button>
  <button data-style="satellite">위성</button>
</div>
<div class="list-panel" id="listPanel">
  <div class="list-head">
    <div class="list-head-row">
      <input type="text" id="listSearch" placeholder="카메라 이름 검색">
      <button class="panel-close" id="listClose">✕</button>
    </div>
    <div class="list-meta" id="listMeta">videoId 캐시 준비</div>
  </div>
  <ul class="list-items" id="listItems"></ul>
</div>
<div class="panel" id="panel">
  <div class="panel-resize" id="panelResize"></div>
  <div class="panel-head">
    <span class="live-badge"><span class="dot"></span>LIVE</span>
    <div class="panel-title" id="panelTitle">-</div>
    <button class="panel-close" id="panelClose">✕</button>
  </div>
  <div class="video-wrap" id="videoWrap"></div>
  <div class="video-footer" id="videoFooter">
    <span class="viewers-label" id="panelViewers"></span>
    <div class="footer-actions">
      <button type="button" class="btn-refresh" id="panelRefreshBtn" style="display:none">ID 갱신</button>
      <a id="openTabBtn" href="#" target="_blank" rel="noopener noreferrer">새 탭에서 열기 ↗</a>
    </div>
  </div>
  <div class="panel-body">
    <div class="loc" id="panelLoc">-</div>
    <div id="panelDesc">-</div>
    <div class="src" id="panelSrc">-</div>
  </div>
</div>
<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box">
    <h3>카메라 추가</h3>
    <div class="coord" id="modalCoord">-</div>
    <div class="field">
      <label>이름</label>
      <input type="text" id="fName" placeholder="예: 해운대 해수욕장">
    </div>
    <div class="field">
      <label>영상 링크</label>
      <input type="text" id="fUrl" placeholder="유튜브 또는 live-redirect">
      <div class="err" id="fUrlErr">링크를 인식하지 못했어요.</div>
    </div>
    <div class="field">
      <label>설명 (선택)</label>
      <textarea id="fDesc" rows="2"></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" id="modalCancel">취소</button>
      <button class="btn-generate" id="modalGenerate">코드 생성</button>
    </div>
    <div class="code-result" id="codeResult">
      <pre id="codeText"></pre>
      <button class="btn-copy" id="btnCopy">코드 복사</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.17/hls.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.3.0/dist/maplibre-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@maplibre/maplibre-gl-leaflet/leaflet-maplibre-gl.js"></script>
<script>
  const MAPTILER_KEY = 'EhogGAwYASE0hk398mb8';
  const YOUTUBE_API_KEY = 'AIzaSyBbGHS7EXSuj1t9V187FIr1flIfDMec3xA';
  const VIEWERS_SS_KEY = 'livecam-viewers-v1';
  const RESOLVED_KEY = 'livecam-resolved-v1';
  const RESOLVED_TTL = 12 * 60 * 60 * 1000; // 12시간
  const RESOLVE_STATUS_TTL = 12 * 60 * 60 * 1000; // 라이브 없음/확인 실패 상태 12시간
  const VIEWER_MEM_TTL = 10 * 60 * 1000; // 10분
  const RESOLVE_TIMEOUT = 25000;
  const RESOLVE_CONCURRENCY = 2;

  const viewerCache = new Map();
  let activeCamForPanel = null;

  function formatViewers(n) {
    if (n == null || n === '') return null;
    const num = Number(n);

  /**
   * live-redirect?format=json 은 서버 HTML만 주므로
   * 숨은 iframe + postMessage 로 videoId 수신
   * (live-redirect respondJson 에서 parent.postMessage 필요)
   */
  function resolveFromLiveRedirect(externalUrl, force) {
    return new Promise((resolve, reject) => {
      let u;
      try { u = new URL(externalUrl, location.href); }
      catch (e) { reject(new Error('잘못된 URL')); return; }
      u.searchParams.set('format', 'json');
      if (force) u.searchParams.set('force', '1');
      else u.searchParams.delete('force');

      const iframe = document.createElement('iframe');
      iframe.setAttribute('aria-hidden', 'true');
      iframe.style.cssText = 'position:fixed;width:1px;height:1px;opacity:0;pointer-events:none;left:-9999px;';
      let done = false;
      const timer = setTimeout(() => {
        cleanup();
        reject(new Error('해석 시간 초과 — live-redirect postMessage 확인'));
      }, RESOLVE_TIMEOUT);

      function onMsg(e) {
        const d = e.data;
        if (!d || d.type !== 'live-redirect-result') return;
        cleanup();
        if (d.ok && d.videoId) {
          resolve(d.videoId);
        } else {
          const err = new Error(d.message || d.error || '라이브 없음');
          err.code = d.error || 'unknown';
          reject(err);
        }
      }
      function cleanup() {
        if (done) return;
        done = true;
        clearTimeout(timer);
        window.removeEventListener('message', onMsg);
        try { iframe.remove(); } catch (_) {}
      }
      window.addEventListener('message', onMsg);
      iframe.src = u.toString();
      document.body.appendChild(iframe);
    });
  }

  async function ensureVideoId(cam, force) {

    if (cam.videoId && !force) return cam.videoId;
    if (!cam.externalUrl) return cam.videoId || null;
    const id = await resolveFromLiveRedirect(cam.externalUrl, !!force);
    setStoredVideoId(cam, id);
    return id;
  }

  async function fetchConcurrentViewersBatch(videoIds) {
    const ids = [...new Set(videoIds.filter(Boolean))];
    const result = {};
    if (!ids.length || !YOUTUBE_API_KEY) return result;
    const now = Date.now();
    const need = [];
    for (const id of ids) {
      const c = viewerCache.get(id);
      if (c && now - c.ts < VIEWER_MEM_TTL) result[id] = c.count;
      else need.push(id);
    }
    for (let i = 0; i < need.length; i += 50) {
      const chunk = need.slice(i, i + 50);
      try {
        const url =
          'https://www.googleapis.com/youtube/v3/videos?part=liveStreamingDetails&id=' +
          encodeURIComponent(chunk.join(',')) +
          '&key=' + encodeURIComponent(YOUTUBE_API_KEY);
        const res = await fetch(url);
        if (!res.ok) throw new Error('yt ' + res.status);
        const data = await res.json();
        for (const item of (data.items || [])) {
          const raw = item.liveStreamingDetails && item.liveStreamingDetails.concurrentViewers;
          const count = raw != null ? Number(raw) : 0;
          viewerCache.set(item.id, { count, ts: Date.now() });
          result[item.id] = count;
        }
        for (const id of chunk) {
          if (!(id in result)) {
            viewerCache.set(id, { count: 0, ts: Date.now() });
            result[id] = 0;
          }
        }
      } catch (e) {
        console.warn('시청자 일괄 실패', e.message);
        chunk.forEach(id => { if (!(id in result)) result[id] = null; });
      }
    }
    return result;
  }

  async function fetchOneViewer(videoId) {
    if (!videoId) return null;
    const batch = await fetchConcurrentViewersBatch([videoId]);
    return batch[videoId] != null ? batch[videoId] : null;
  }

  // ITS
  const ITS_API_KEY = 'f9565bfc1f2b4a68a26c48120f5c27b3';
  const ITS_ENDPOINT = 'https://openapi.its.go.kr:9443/cctvInfo';
  const ITS_MIN_ZOOM = 7;
  let cctvOn = false, cctvLoading = false;
  const cctvLayer = L.markerClusterGroup({
    maxClusterRadius: 50, disableClusteringAtZoom: 15,
    iconCreateFunction: cluster => L.divIcon({
      html: `<span>${cluster.getChildCount()}</span>`, className: 'marker-cluster-custom', iconSize: [36, 36],
    }),
  });
  function itsUrl(bounds) {
    const p = new URLSearchParams({
      apiKey: ITS_API_KEY, type: 'all', cctvType: '1',
      minX: bounds.getWest(), maxX: bounds.getEast(),
      minY: bounds.getSouth(), maxY: bounds.getNorth(), getType: 'json',
    });
    return `${ITS_ENDPOINT}?${p}`;
  }
  async function loadCctvInView() {
    if (!cctvOn || cctvLoading) return;
    if (map.getZoom() < ITS_MIN_ZOOM) { cctvLayer.clearLayers(); updateCount(); return; }
    cctvLoading = true;
    try {
      const res = await fetch(itsUrl(map.getBounds()));
      if (!res.ok) throw new Error('http ' + res.status);
      const data = await res.json();
      const list = (data.response && data.response.data) || [];
      cctvLayer.clearLayers();
      list.forEach(c => {
        if (!c.coordy || !c.coordx) return;
        const marker = L.marker([c.coordy, c.coordx], {
          icon: L.divIcon({ className: 'cctv-marker', iconSize: [12, 12] })
        });
        marker.bindTooltip(c.cctvname || 'CCTV', { direction: 'top', offset: [0, -8], className: 'cam-tip', opacity: 1 });
        marker.on('click', () => openCctv(c, marker));
        cctvLayer.addLayer(marker);
      });
      updateCount();
    } catch (e) { console.warn('ITS', e.message); }
    finally { cctvLoading = false; }
  }
  function openCctv(c, marker) {

        activeHls.on(Hls.Events.ERROR, (_, d) => {
          if (d.fatal) videoWrap.innerHTML = '<div class="video-state">재생 불가</div>';
        });
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = streamUrl;
        video.addEventListener('loadedmetadata', () => state?.remove());
        video.play().catch(()=>{});

  function updateListMeta() {
    const resolved = loadResolvedMap();
    let n = 0;
    cams.forEach(c => {
      if (c.videoId || (resolved[camKey(c)] && resolved[camKey(c)].videoId)) n++;

  async function runResolveQueue(missingCams) {
    if (resolveQueueRunning || !missingCams.length) return;
    resolveQueueRunning = true;
    const meta = document.getElementById('listMeta');
    let i = 0;
    async function worker() {
      while (i < missingCams.length) {
        const idx = i++;
        const cam = missingCams[idx];
        meta.textContent = `ID 해석 ${idx + 1}/${missingCams.length}…`;
        meta.className = 'list-meta warn';
        try {
          await ensureVideoId(cam, false);

          // 정상적으로 라이브 ID를 찾았으면 실패 상태가 남아 있지 않도록 정리
          const all = loadResolvedMap();
          const key = camKey(cam);
          if (all[key]?.status) {
            all[key] = { videoId: all[key].videoId, ts: Date.now() };
            saveResolvedMap(all);
          }
        } catch (e) {
          console.warn('resolve', cam.name, e.message);

          if (e.code === 'no_live') {
            setResolveStatus(cam, 'offline', '현재 라이브 진행중이지 않음');
          } else {
            // 429 할당량 초과, 네트워크 오류 등도 자동 재시도하지 않도록 기록
            setResolveStatus(cam, 'error', e.message || '라이브 확인 실패');
          }
        }
      }
    }
    const workers = [];
    for (let w = 0; w < Math.min(RESOLVE_CONCURRENCY, missingCams.length); w++) workers.push(worker());
    await Promise.all(workers);
    resolveQueueRunning = false;
    updateListMeta();
    if (listPanel.classList.contains('open')) renderList(listSearch.value);
  }


  // 목록 호버 미리보기
  // YouTube Data API를 호출하지 않고, 이미 확보된 videoId가 있는 경우에만 iframe을 띄운다.
  let listHoverPreview = null;
  let listHoverTimer = null;
  let listHoverCam = null;
  let listHoverLi = null;

  function closeListHoverPreview() {
    if (listHoverTimer) {
      clearTimeout(listHoverTimer);
      listHoverTimer = null;
    }

    if (listHoverPreview) {
      listHoverPreview.remove();
      listHoverPreview = null;
    }

    listHoverCam = null;
    listHoverLi = null;
  }

  function positionListHoverPreview(li) {
    if (!listHoverPreview) return;

    const r = li.getBoundingClientRect();
    const gap = 10;
    const w = 360;
    const h = 203;

    let left = r.right + gap;
    let top = r.top;

    // 오른쪽 공간이 부족하면 목록 왼쪽에 표시
    if (left + w > window.innerWidth - 8) {
      left = r.left - w - gap;
    }

    // 화면 아래로 넘어가면 위쪽으로 보정
    if (top + h > window.innerHeight - 8) {
      top = window.innerHeight - h - 8;
    }

    if (top < 8) top = 8;

    listHoverPreview.style.left = `${Math.round(left)}px`;
    listHoverPreview.style.top = `${Math.round(top)}px`;
  }

  function openListHoverPreview(cam, li) {
    const videoId = getStoredVideoId(cam) || cam.videoId;

    // API 호출/ID 자동 해석은 하지 않는다.
    // 이미 videoId가 확보된 방송만 호버 미리보기를 보여준다.
    if (!videoId) return;

    closeListHoverPreview();

    listHoverCam = cam;
    listHoverLi = li;

    const wrap = document.createElement('div');
    wrap.className = 'list-hover-preview';

    const iframe = document.createElement('iframe');
    iframe.src =
      `https://www.youtube.com/embed/${videoId}?autoplay=1&mute=1&playsinline=1&controls=0&rel=0`;
    iframe.allow =
      'autoplay; encrypted-media; picture-in-picture';
    iframe.allowFullscreen = true;

    wrap.appendChild(iframe);
    document.body.appendChild(wrap);
    listHoverPreview = wrap;

    positionListHoverPreview(li);

    requestAnimationFrame(() => {
      if (listHoverPreview === wrap) wrap.classList.add('show');
    });
  }

  function bindListHoverPreview(li, cam) {
    li.addEventListener('mouseenter', () => {
      closeListHoverPreview();

      // 너무 빠르게 지나가는 경우 iframe을 만들지 않도록 350ms 지연
      listHoverTimer = setTimeout(() => {
        if (li.matches(':hover')) {
          openListHoverPreview(cam, li);
        }
      }, 350);
    });

    li.addEventListener('mouseleave', closeListHoverPreview);
  }

  async function renderList(filterText) {
    const q = (filterText || '').trim().toLowerCase();
    closeListHoverPreview();
    listItems.innerHTML = '';
    const filtered = cams.filter(c => !q || c.name.toLowerCase().includes(q));
    const ss = loadViewersFromSS();
    const idsForBatch = [];

    for (const c of filtered) {
      const li = document.createElement('li');
      const vid = getStoredVideoId(c);
      const resolveStatus = getResolveStatus(c);

      if (vid) idsForBatch.push(vid);

      const cachedV = vid && ss[vid] != null ? ss[vid] : (ss[camKey(c)] != null ? ss[camKey(c)] : null);
      let initial = '-';
      let has = false;

      if (resolveStatus?.status === 'offline') {
        initial = '라이브 진행중이지 않음';
      } else if (resolveStatus?.status === 'error') {
        initial = '확인 실패';
      } else if (cachedV != null && cachedV !== '') {
        initial = formatViewers(cachedV);
        has = !!initial;
      } else if (vid) {
        initial = '…';
      }
      const statusClass = resolveStatus ? ' status-text' : '';
      li.innerHTML =
        `<span class="tag"></span><span class="nm">${c.name}</span>` +
        `<span class="viewers${has ? ' has-count' : ''}${statusClass}">${initial}</span>` +
        (c.externalUrl
          ? `<button type="button" class="btn-rid" data-refresh="1" title="live-redirect 재해석">갱신</button>`
          : '');
      li.querySelector('.nm').addEventListener('click', () => {
        map.flyTo([c.lat, c.lng], 15, { duration: 0.6 });
        const marker = camMarkers.get(c);
        if (marker) openCam(c, marker);
        listPanel.classList.remove('open');
      });
      bindListHoverPreview(li, c);
      const ridBtn = li.querySelector('.btn-rid');
      if (ridBtn) {
        ridBtn.addEventListener('click', async (ev) => {
          ev.stopPropagation();
          ridBtn.disabled = true;
          ridBtn.textContent = '…';
          clearStoredVideoId(c);

          try {
            // 수동 갱신이므로 이전 offline/error 상태를 지우고 강제 확인
            const all = loadResolvedMap();
            delete all[camKey(c)];
            saveResolvedMap(all);

            await ensureVideoId(c, true);

            ridBtn.textContent = 'OK';
            setTimeout(() => renderList(listSearch.value), 300);
          } catch (e) {
            if (e.code === 'no_live') {
              setResolveStatus(c, 'offline', '현재 라이브 진행중이지 않음');
            } else {
              setResolveStatus(c, 'error', e.message || '라이브 확인 실패');
            }

            ridBtn.textContent = '실패';
            ridBtn.disabled = false;
            console.warn('수동 resolve 실패', c.name, e.message);
            setTimeout(() => renderList(listSearch.value), 300);
          }
        });
      }
      listItems.appendChild(li);
    }

    if (cctvOn) {
      cctvLayer.eachLayer(marker => {
        const name = 'CCTV';
        if (q && !name.toLowerCase().includes(q)) return;
        const li = document.createElement('li');
        li.className = 'is-cctv';
        li.innerHTML = `<span class="tag"></span><span class="nm">${name}</span><span class="viewers">-</span>`;
        li.addEventListener('click', () => {
          map.flyTo(marker.getLatLng(), Math.max(map.getZoom(), 15), { duration: 0.6 });
          marker.fire('click');
          listPanel.classList.remove('open');
        });
        listItems.appendChild(li);
      });
    }

    if (!listItems.children.length) {
      listItems.innerHTML = '<li class="list-empty" style="cursor:default">검색 결과 없음</li>';
      return;
    }

    // 시청자 일괄
    const batch = await fetchConcurrentViewersBatch(idsForBatch);
    const nextSS = { ...ss };
    const rows = [...listItems.querySelectorAll('li:not(.is-cctv)')];
    filtered.forEach((c, i) => {
      const el = rows[i] && rows[i].querySelector('.viewers');
      if (!el) return;
      const vid = getStoredVideoId(c);
      if (!vid) {
        el.textContent = '-';
        el.classList.remove('has-count');
        return;
      }
      const n = batch[vid];
      const t = formatViewers(n);
      el.textContent = t || '-';
      el.classList.toggle('has-count', !!t);
      if (n != null) {
        nextSS[vid] = n;
        nextSS[camKey(c)] = n;
      }
    });
    saveViewersToSS(nextSS);
    updateListMeta();

    // 캐시 없는 externalUrl만 자동으로 1회 확인한다.
    // 이미 offline/error 상태가 저장된 카메라는 다시 조회하지 않는다.
    const missing = filtered.filter(c => {
      if (!c.externalUrl || getStoredVideoId(c)) return false;

      const status = getResolveStatus(c);
      if (status && (status.status === 'offline' || status.status === 'error')) {
        return false;
      }

      return true;
    });

    if (missing.length) runResolveQueue(missing);
  }

  function extractYoutubeId(input) {
    input = input.trim();
    if (/^[a-zA-Z0-9_-]{11}$/.test(input)) return input;
    const patterns = [
      /(?:youtube\.com\/watch\?v=)([a-zA-Z0-9_-]{11})/,
      /(?:youtu\.be\/)([a-zA-Z0-9_-]{11})/,
      /(?:youtube\.com\/live\/)([a-zA-Z0-9_-]{11})/,
      /(?:youtube\.com\/embed\/)([a-zA-Z0-9_-]{11})/,
      /[?&]v=([a-zA-Z0-9_-]{11})/,
    ];
    for (const re of patterns) {
      const m = input.match(re);
      if (m) return m[1];
    }
    return null;
  }
  function closeModal() {
    modalOverlay.classList.remove('show');

  document.getElementById('modalCancel').addEventListener('click', closeModal);
  document.getElementById('modalGenerate').addEventListener('click', () => {
    const name = document.getElementById('fName').value.trim() || '이름 없는 카메라';
    const urlRaw = document.getElementById('fUrl').value.trim();
    const desc = document.getElementById('fDesc').value.trim() || '설명 없음';
    const vid = extractYoutubeId(urlRaw);
    const errEl = document.getElementById('fUrlErr');
    let camData;
    if (vid) {
      camData = { name, lat: +pickedLatLng.lat.toFixed(6), lng: +pickedLatLng.lng.toFixed(6), videoId: vid, desc };
    } else if (/^https?:\/\//i.test(urlRaw)) {
      camData = { name, lat: +pickedLatLng.lat.toFixed(6), lng: +pickedLatLng.lng.toFixed(6), externalUrl: urlRaw, desc };
    } else {
      errEl.classList.add('show');
      return;
    }
    errEl.classList.remove('show');
    codeText.textContent = camData.videoId
      ? `{ name: "${name.replace(/"/g,'\\"')}", lat: ${camData.lat}, lng: ${camData.lng}, videoId: "${camData.videoId}", desc: "${desc.replace(/"/g,'\\"')}" },`
      : `{ name: "${name.replace(/"/g,'\\"')}", lat: ${camData.lat}, lng: ${camData.lng}, externalUrl: "${camData.externalUrl.replace(/"/g,'\\"')}", desc: "${desc.replace(/"/g,'\\"')}" },`;
    codeResult.classList.add('show');
    addCamMarker(camData);
    cams.push(camData);
    updateCount();
  });
  btnCopy.addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(codeText.textContent);
      btnCopy.textContent = '복사됨 ✓';
      setTimeout(() => { btnCopy.textContent = '코드 복사'; }, 1600);
    } catch (_) {}
  });

  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    if (modalOverlay.classList.contains('show')) { closeModal(); return; }
    if (panel.classList.contains('open')) { closeCam(); return; }
    if (listPanel.classList.contains('open')) listPanel.classList.remove('open');
  });

  (function initPanelResize() {
    const panelEl = document.getElementById('panel');
    const handle = document.getElementById('panelResize');
    if (!panelEl || !handle) return;
    const KEY = 'livecam-panel-width';
    const MIN_W = 280;
    const MAX_W = () => Math.min(1600, window.innerWidth * 0.96);
    const saved = localStorage.getItem(KEY);
    if (saved) panelEl.style.width = Math.min(MAX_W(), Math.max(MIN_W, parseInt(saved, 10))) + 'px';
    let startX = 0, startW = 0;
    function onMove(e) {
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      panelEl.style.width = Math.min(MAX_W(), Math.max(MIN_W, startW + (startX - clientX))) + 'px';
    }
    function onUp() {
      panelEl.classList.remove('resizing');
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
      document.removeEventListener('touchmove', onMove);
      document.removeEventListener('touchend', onUp);
      localStorage.setItem(KEY, parseInt(panelEl.style.width, 10) || 380);
    }
    function onDown(e) {
      e.preventDefault();
      startX = e.touches ? e.touches[0].clientX : e.clientX;
      startW = panelEl.getBoundingClientRect().width;
      panelEl.classList.add('resizing');
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
      document.addEventListener('touchmove', onMove, { passive: false });
      document.addEventListener('touchend', onUp);
    }
    handle.addEventListener('mousedown', onDown);
    handle.addEventListener('touchstart', onDown, { passive: false });
  })();

  updateCount();
  updateListMeta();
</script>
</body>
</html>
