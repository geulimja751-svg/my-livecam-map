<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>라이브캠 지도 데모</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<style>
  :root{
    --bg: #0a0e14;
    --panel: #10151d;
    --line: #1e2733;
    --text: #e8edf3;
    --text-dim: #7d8a9a;
    --accent: #4fb3ff;
    --accent-glow: rgba(79,179,255,0.55);
    --live-red: #ff4d5e;
    --mono: 'SF Mono', 'Consolas', 'Menlo', monospace;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%; width:100%;
    background:var(--bg); color:var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Pretendard', 'Malgun Gothic', sans-serif;
    overflow:hidden;
  }
  #map{
    position:absolute; inset:0;
    background:var(--bg);
  }
  .leaflet-container{ background:var(--bg); }
  .dark-tiles{
    filter: invert(1) hue-rotate(180deg) brightness(0.85) contrast(0.9) saturate(0.6);
  }

  /* top bar */
  .topbar{
    position:absolute; top:0; left:0; right:0; z-index:1000;
    display:flex; align-items:center; gap:10px;
    padding:16px 18px;
    pointer-events:none;
  }
  .brand{
    display:flex; flex-direction:column; gap:2px;
    pointer-events:auto;
  }
  .brand .kicker{
    font-family:var(--mono); font-size:10px; letter-spacing:0.18em;
    color:var(--accent); text-transform:uppercase;
  }
  .brand .title{
    font-size:15px; font-weight:600; color:var(--text);
    letter-spacing:-0.01em;
  }
  .count-pill{
    margin-left:auto; pointer-events:auto;
    background:var(--panel); border:1px solid var(--line);
    border-radius:20px; padding:7px 14px;
    font-family:var(--mono); font-size:11px; color:var(--text-dim);
    display:flex; align-items:center; gap:6px;
  }
  .count-pill b{ color:var(--text); font-weight:600; }
  .count-pill .dot{
    width:6px; height:6px; border-radius:50%;
    background:var(--live-red);
    box-shadow:0 0 6px var(--live-red);
    animation: blink 1.6s ease-in-out infinite;
  }
  @keyframes blink{ 0%,100%{opacity:1;} 50%{opacity:0.25;} }

  /* custom marker */
  .cam-marker{
    width:20px; height:20px; border-radius:50%;
    background:var(--accent);
    border:2px solid #0a0e14;
    box-shadow:0 0 0 4px var(--accent-glow), 0 0 14px var(--accent-glow);
    cursor:pointer;
    transition: transform 0.15s ease;
  }
  .cam-marker:hover{ transform:scale(1.25); }
  .cam-marker.active{
    background:#ffb020;
    box-shadow:0 0 0 5px rgba(255,176,32,0.5), 0 0 18px rgba(255,176,32,0.6);
  }

  /* bottom sheet / side panel */
  .panel{
    position:absolute; z-index:1100;
    background:var(--panel);
    border:1px solid var(--line);
    box-shadow: 0 -8px 40px rgba(0,0,0,0.5);
    display:flex; flex-direction:column;
    transform: translateY(110%);
    transition: transform 0.32s cubic-bezier(.2,.9,.25,1);
  }
  /* desktop: right side panel */
  @media (min-width: 720px){
    .panel{
      top:16px; right:16px; bottom:16px; width:380px;
      border-radius:14px; transform: translateX(120%);
    }
    .panel.open{ transform: translateX(0); }
  }
  /* mobile: bottom sheet */
  @media (max-width: 719px){
    .panel{
      left:0; right:0; bottom:0; height:58%;
      border-radius:16px 16px 0 0;
    }
    .panel.open{ transform: translateY(0); }
  }

  .panel-head{
    display:flex; align-items:center; gap:10px;
    padding:14px 16px; border-bottom:1px solid var(--line);
    flex-shrink:0;
  }
  .live-badge{
    display:flex; align-items:center; gap:5px;
    background:rgba(255,77,94,0.12); border:1px solid rgba(255,77,94,0.35);
    color:var(--live-red); font-family:var(--mono); font-size:10px;
    font-weight:700; letter-spacing:0.08em;
    padding:3px 8px; border-radius:20px;
  }
  .live-badge .dot{
    width:5px; height:5px; border-radius:50%; background:var(--live-red);
    animation: blink 1.4s ease-in-out infinite;
  }
  .panel-title{
    font-size:14px; font-weight:600; flex:1;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .panel-close{
    background:none; border:none; color:var(--text-dim);
    font-size:18px; cursor:pointer; padding:4px 6px; line-height:1;
    border-radius:6px;
  }
  .panel-close:hover{ background:var(--line); color:var(--text); }

  .video-wrap{
    position:relative; width:100%; aspect-ratio:16/9;
    background:#000; flex-shrink:0;
  }
  .video-wrap iframe{
    position:absolute; inset:0; width:100%; height:100%; border:0;
  }
  .external-cta{
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:10px; padding:20px; text-align:center;
    background:linear-gradient(180deg,#0d1420,#05070a);
  }
  .external-cta-icon{
    width:44px; height:44px; border-radius:50%;
    background:var(--accent); color:#0a0e14;
    display:flex; align-items:center; justify-content:center;
    font-size:16px;
  }
  .external-cta-text{ font-size:12.5px; color:var(--text-dim); }
  .external-cta-btn{
    margin-top:4px;
    background:var(--accent); color:#0a0e14;
    font-size:12.5px; font-weight:700;
    padding:9px 16px; border-radius:20px;
    text-decoration:none;
  }
  .external-cta-btn:hover{ filter:brightness(1.08); }

  .panel-body{
    padding:14px 16px; overflow-y:auto;
    font-size:12.5px; color:var(--text-dim); line-height:1.6;
  }
  .panel-body .loc{ color:var(--text); font-weight:600; font-size:13px; margin-bottom:4px; }
  .panel-body .src{ font-family:var(--mono); font-size:10.5px; color:#4d5a6a; margin-top:8px; }

  .hint{
    position:absolute; left:50%; bottom:20px; transform:translateX(-50%);
    z-index:900; pointer-events:none;
    background:var(--panel); border:1px solid var(--line);
    padding:8px 14px; border-radius:20px;
    font-size:11.5px; color:var(--text-dim);
    opacity:1; transition:opacity 0.4s ease;
  }
  .hint.hidden{ opacity:0; }

  .leaflet-control-zoom{
    border:1px solid var(--line) !important;
    margin-top:70px !important;
  }
  .leaflet-control-zoom a{
    background:var(--panel) !important; color:var(--text) !important;
    border-color:var(--line) !important;
  }
  .leaflet-control-zoom a:hover{ background:var(--line) !important; }
  .leaflet-control-attribution{
    background:rgba(10,14,20,0.75) !important; color:var(--text-dim) !important;
    font-size:9px !important;
  }
  .leaflet-control-attribution a{ color:var(--accent) !important; }

  /* map style switcher */
  .style-switch{
    position:absolute; left:16px; bottom:20px; z-index:900;
    display:flex; gap:2px;
    background:var(--panel); border:1px solid var(--line);
    border-radius:12px; padding:3px;
    box-shadow:0 6px 24px rgba(0,0,0,0.4);
  }
  .style-switch button{
    appearance:none; border:none; background:transparent;
    color:var(--text-dim); font-size:11.5px; font-weight:600;
    padding:7px 12px; border-radius:9px; cursor:pointer;
    font-family:inherit; letter-spacing:-0.01em;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .style-switch button:hover{ color:var(--text); }
  .style-switch button.active{
    background:var(--accent); color:#0a0e14;
  }

  /* add-cam button */
  .add-btn{
    pointer-events:auto;
    display:flex; align-items:center; gap:6px;
    background:var(--panel); border:1px solid var(--line);
    color:var(--text); font-size:12px; font-weight:600;
    padding:8px 14px; border-radius:20px; cursor:pointer;
    font-family:inherit;
  }
  .add-btn:hover{ border-color:var(--accent); color:var(--accent); }
  .add-btn.active{
    background:var(--accent); color:#0a0e14; border-color:var(--accent);
  }
  #map.picking{ cursor:crosshair; }

  .pick-hint{
    position:absolute; top:64px; left:50%; transform:translateX(-50%);
    z-index:950; background:var(--accent); color:#0a0e14;
    font-size:12px; font-weight:600; padding:8px 16px; border-radius:20px;
    display:none; box-shadow:0 6px 20px rgba(79,179,255,0.35);
  }
  .pick-hint.show{ display:block; }

  .temp-marker{
    width:22px; height:22px; border-radius:50%;
    background:#ff8a1e; border:2px solid #0a0e14;
    box-shadow:0 0 0 5px rgba(255,138,30,0.45), 0 0 16px rgba(255,138,30,0.6);
  }

  /* add-cam modal */
  .modal-overlay{
    position:absolute; inset:0; z-index:1300;
    background:rgba(5,7,10,0.55);
    display:none; align-items:center; justify-content:center;
    padding:20px;
  }
  .modal-overlay.show{ display:flex; }
  .modal-box{
    width:100%; max-width:380px;
    background:var(--panel); border:1px solid var(--line);
    border-radius:14px; padding:18px;
    box-shadow:0 20px 60px rgba(0,0,0,0.6);
  }
  .modal-box h3{
    margin:0 0 4px; font-size:15px; color:var(--text);
  }
  .modal-box .coord{
    font-family:var(--mono); font-size:11px; color:var(--text-dim); margin-bottom:14px;
  }
  .field{ margin-bottom:12px; }
  .field label{
    display:block; font-size:11.5px; color:var(--text-dim); margin-bottom:5px;
  }
  .field input, .field textarea{
    width:100%; background:#0a0e14; border:1px solid var(--line);
    color:var(--text); font-size:13px; padding:9px 10px;
    border-radius:8px; font-family:inherit; resize:none;
  }
  .field input:focus, .field textarea:focus{
    outline:none; border-color:var(--accent);
  }
  .field .err{ color:var(--live-red); font-size:11px; margin-top:5px; display:none; }
  .field .err.show{ display:block; }

  .modal-actions{
    display:flex; gap:8px; margin-top:4px;
  }
  .modal-actions button{
    flex:1; padding:10px; border-radius:8px; border:none;
    font-size:13px; font-weight:600; cursor:pointer; font-family:inherit;
  }
  .btn-cancel{ background:var(--line); color:var(--text-dim); }
  .btn-cancel:hover{ color:var(--text); }
  .btn-generate{ background:var(--accent); color:#0a0e14; }
  .btn-generate:hover{ filter:brightness(1.08); }

  .code-result{ margin-top:14px; display:none; }
  .code-result.show{ display:block; }
  .code-result pre{
    background:#05070a; border:1px solid var(--line); border-radius:8px;
    padding:10px; font-family:var(--mono); font-size:10.5px; color:#9fd6ff;
    white-space:pre-wrap; word-break:break-all; margin:0 0 8px;
    max-height:120px; overflow-y:auto;
  }
  .btn-copy{
    width:100%; background:transparent; border:1px solid var(--accent);
    color:var(--accent); padding:9px; border-radius:8px; font-size:12.5px;
    font-weight:600; cursor:pointer; font-family:inherit;
  }
  .btn-copy:hover{ background:rgba(79,179,255,0.1); }
  .btn-copy.copied{ background:var(--accent); color:#0a0e14; }
</style>
</head>
<body>

<div id="map"></div>

<div class="topbar">
  <div class="brand">
    <div class="kicker">Live Cam Map · Demo</div>
    <div class="title">부산 실시간 카메라</div>
  </div>
  <div class="count-pill"><span class="dot"></span>등록 <b id="camCount">0</b>개</div>
  <button class="add-btn" id="addBtn">+ 카메라 추가</button>
</div>

<div class="pick-hint" id="pickHint">지도를 클릭해 카메라 위치를 선택하세요 (취소: 버튼 다시 클릭)</div>

<div class="hint" id="hint">지도 위 점을 눌러보세요</div>

<div class="style-switch" id="styleSwitch">
  <button data-style="dark" class="active">다크</button>
  <button data-style="clean">클린</button>
  <button data-style="satellite">위성</button>
</div>

<div class="panel" id="panel">
  <div class="panel-head">
    <span class="live-badge"><span class="dot"></span>LIVE</span>
    <div class="panel-title" id="panelTitle">-</div>
    <button class="panel-close" id="panelClose">✕</button>
  </div>
  <div class="video-wrap" id="videoWrap"></div>
  <div class="panel-body">
    <div class="loc" id="panelLoc">-</div>
    <div id="panelDesc">-</div>
    <div class="src" id="panelSrc">-</div>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box">
    <h3>카메라 추가</h3>
    <div class="coord" id="modalCoord">-</div>

    <div class="field">
      <label>이름</label>
      <input type="text" id="fName" placeholder="예: 해운대 해수욕장">
    </div>
    <div class="field">
      <label>영상 링크</label>
      <input type="text" id="fUrl" placeholder="유튜브 링크 또는 라이브 리다이렉트 링크(https://...)">
      <div class="err" id="fUrlErr">링크를 인식하지 못했어요. http(s)로 시작하는 주소인지 확인해주세요.</div>
    </div>
    <div class="field">
      <label>설명 (선택)</label>
      <textarea id="fDesc" rows="2" placeholder="예: 해운대 해변가 실시간 화면"></textarea>
    </div>

    <div class="modal-actions">
      <button class="btn-cancel" id="modalCancel">취소</button>
      <button class="btn-generate" id="modalGenerate">코드 생성</button>
    </div>

    <div class="code-result" id="codeResult">
      <pre id="codeText"></pre>
      <button class="btn-copy" id="btnCopy">코드 복사</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>

  // ── 기본 예시 데이터: 실제로는 이 배열을 원하는 만큼 늘리면 됩니다.
  // videoId는 유튜브 라이브 스트림의 watch?v= 뒤에 오는 값입니다.
  const cams = [
    { name: "부산항대교 전망",     lat: 35.1046, lng: 129.0768, videoId: "jfKfPfyJRdk", desc: "부산항대교 인근 상시 라이브 스트림 예시" },
    { name: "광안대교 야경",       lat: 35.1533, lng: 129.1186, videoId: "jfKfPfyJRdk", desc: "광안대교 방면 라이브캠 예시 지점" },
    { name: "해운대 해수욕장",     lat: 35.1587, lng: 129.1604, videoId: "jfKfPfyJRdk", desc: "해운대 해변가 실시간 화면 예시" },
    { name: "송정 해변",           lat: 35.1785, lng: 129.2005, videoId: "jfKfPfyJRdk", desc: "송정 해수욕장 라이브 예시" },
    { name: "기장 오시리아",       lat: 35.1963, lng: 129.2287, videoId: "jfKfPfyJRdk", desc: "기장군 해안 도로변 예시" },
    { name: "동백섬",              lat: 35.1547, lng: 129.1518, videoId: "jfKfPfyJRdk", desc: "동백섬 산책로 예시 지점" },
    { name: "오사카성", lat: 34.687445, lng: 135.52578, externalUrl: "https://www.youtube.com/@tvosakanews/live", desc: "오사카성" },
  ];

  const map = L.map('map', {
    zoomControl: true,
    attributionControl: true,
    minZoom: 3,
    maxZoom: 20,
  }).setView([35.16, 129.15], 12);

  // ── 지도 스타일 정의 ──────────────────────────────
  // dark: OSM 표준 타일 + CSS 반전 필터 (미리보기 샌드박스에서도 안정적으로 로드됨)
  // clean: CARTO Voyager (밝고 깔끔한 스타일, 실제 배포 후 사용 권장)
  // satellite: Esri 위성 이미지 (무료, API 키 불필요, 실제 배포 후 사용 권장)
  const styles = {
    dark: {
      url: 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
      options: { attribution: '&copy; OpenStreetMap contributors', subdomains: 'abc', maxZoom: 19, className: 'dark-tiles' }
    },
    clean: {
      url: 'https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',
      options: { attribution: '&copy; OpenStreetMap &copy; CARTO', subdomains: 'abcd', maxZoom: 20 }
    },
    satellite: {
      url: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
      options: { attribution: 'Imagery &copy; Esri', maxZoom: 19 }
    }
  };

  let tileLayer = L.tileLayer(styles.dark.url, styles.dark.options).addTo(map);
  let currentStyle = 'dark';

  function switchStyle(name){
    if(name === currentStyle) return;
    map.removeLayer(tileLayer);
    tileLayer = L.tileLayer(styles[name].url, styles[name].options).addTo(map);
    currentStyle = name;
    document.querySelectorAll('#styleSwitch button').forEach(b =>
      b.classList.toggle('active', b.dataset.style === name)
    );
    checkTileLoad();
  }

  document.getElementById('styleSwitch').addEventListener('click', e => {
    const btn = e.target.closest('button');
    if(btn) switchStyle(btn.dataset.style);
  });

  // 타일이 끝내 로드되지 않을 경우(미리보기 샌드박스 등) 대비한 안내 배너
  function checkTileLoad(){
    document.getElementById('tileWarn')?.remove();
    let loaded = false;
    tileLayer.once('load', () => { loaded = true; document.getElementById('tileWarn')?.remove(); });
    setTimeout(() => {
      if(!loaded){
        const warn = document.createElement('div');
        warn.id = 'tileWarn';
        warn.style.cssText = 'position:absolute;top:70px;left:50%;transform:translateX(-50%);z-index:900;background:#10151d;border:1px solid #1e2733;color:#7d8a9a;font-size:11px;padding:8px 14px;border-radius:20px;max-width:80%;text-align:center;';
        warn.textContent = '이 스타일은 미리보기 창에서 로드가 막힐 수 있어요 — 실제 배포 환경에서는 정상 표시됩니다';
        document.body.appendChild(warn);
      }
    }, 3500);
  }
  checkTileLoad();

  const panel = document.getElementById('panel');
  const hint = document.getElementById('hint');
  let activeMarker = null;

  function openCam(cam, marker){
    if(activeMarker) activeMarker.getElement()?.classList.remove('active');
    activeMarker = marker;
    marker.getElement()?.classList.add('active');

    document.getElementById('panelTitle').textContent = cam.name;
    document.getElementById('panelLoc').textContent = cam.name;
    document.getElementById('panelDesc').textContent = cam.desc;

    const videoWrap = document.getElementById('videoWrap');
    const panelSrc = document.getElementById('panelSrc');

    if(cam.videoId){
      panelSrc.textContent = `source: youtube.com/watch?v=${cam.videoId}`;
      videoWrap.innerHTML =
        `<iframe src="https://www.youtube.com/embed/${cam.videoId}?autoplay=1&mute=1"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
          allowfullscreen></iframe>`;
    } else if(cam.externalUrl){
      // 리다이렉트/외부 링크 형식 — iframe 임베드가 막혀있을 수 있어 새 탭으로 엽니다
      panelSrc.textContent = `source: ${cam.externalUrl}`;
      videoWrap.innerHTML = `
        <div class="external-cta">
          <div class="external-cta-icon">▶</div>
          <div class="external-cta-text">이 카메라는 새 탭에서 열립니다</div>
          <a class="external-cta-btn" href="${cam.externalUrl}" target="_blank" rel="noopener noreferrer">라이브 보러 가기 ↗</a>
        </div>`;
      window.open(cam.externalUrl, '_blank', 'noopener,noreferrer');
    }

    panel.classList.add('open');
    hint.classList.add('hidden');
  }

  function closeCam(){
    panel.classList.remove('open');
    document.getElementById('videoWrap').innerHTML = ''; // 재생 중지
    if(activeMarker) activeMarker.getElement()?.classList.remove('active');
    activeMarker = null;
  }

  document.getElementById('panelClose').addEventListener('click', closeCam);

  const camCountEl = document.getElementById('camCount');

  function addCamMarker(cam){
    const icon = L.divIcon({ className: 'cam-marker', iconSize: [20,20] });
    const marker = L.marker([cam.lat, cam.lng], { icon }).addTo(map);
    marker.on('click', () => openCam(cam, marker));
    return marker;
  }

  function updateCount(){
    camCountEl.textContent = cams.length;
  }

  cams.forEach(addCamMarker);
  updateCount();

  // ── 카메라 추가 기능 ──────────────────────────────
  const addBtn = document.getElementById('addBtn');
  const pickHint = document.getElementById('pickHint');
  const mapEl = document.getElementById('map');
  const modalOverlay = document.getElementById('modalOverlay');
  const modalCoord = document.getElementById('modalCoord');
  const codeResult = document.getElementById('codeResult');
  const codeText = document.getElementById('codeText');
  const btnCopy = document.getElementById('btnCopy');

  let pickMode = false;
  let pickedLatLng = null;
  let tempMarker = null;

  function togglePickMode(force){
    pickMode = force !== undefined ? force : !pickMode;
    addBtn.classList.toggle('active', pickMode);
    pickHint.classList.toggle('show', pickMode);
    mapEl.classList.toggle('picking', pickMode);
  }

  addBtn.addEventListener('click', () => togglePickMode());

  map.on('click', (e) => {
    if(!pickMode) return;
    pickedLatLng = e.latlng;
    if(tempMarker) map.removeLayer(tempMarker);
    tempMarker = L.marker(e.latlng, { icon: L.divIcon({ className:'temp-marker', iconSize:[22,22] }) }).addTo(map);

    modalCoord.textContent = `위도 ${e.latlng.lat.toFixed(6)}, 경도 ${e.latlng.lng.toFixed(6)}`;
    document.getElementById('fName').value = '';
    document.getElementById('fUrl').value = '';
    document.getElementById('fDesc').value = '';
    document.getElementById('fUrlErr').classList.remove('show');
    codeResult.classList.remove('show');
    modalOverlay.classList.add('show');
    togglePickMode(false);
  });

  function extractYoutubeId(input){
    input = input.trim();
    // 이미 순수 ID(11자, 영숫자+-_)만 입력한 경우
    if(/^[a-zA-Z0-9_-]{11}$/.test(input)) return input;
    const patterns = [
      /(?:youtube\.com\/watch\?v=)([a-zA-Z0-9_-]{11})/,
      /(?:youtu\.be\/)([a-zA-Z0-9_-]{11})/,
      /(?:youtube\.com\/live\/)([a-zA-Z0-9_-]{11})/,
      /(?:youtube\.com\/embed\/)([a-zA-Z0-9_-]{11})/,
      /[?&]v=([a-zA-Z0-9_-]{11})/,
    ];
    for(const re of patterns){
      const m = input.match(re);
      if(m) return m[1];
    }
    return null;
  }

  document.getElementById('modalCancel').addEventListener('click', closeModal);

  function closeModal(){
    modalOverlay.classList.remove('show');
    if(tempMarker){ map.removeLayer(tempMarker); tempMarker = null; }
  }

  document.getElementById('modalGenerate').addEventListener('click', () => {
    const name = document.getElementById('fName').value.trim() || '이름 없는 카메라';
    const urlRaw = document.getElementById('fUrl').value.trim();
    const desc = document.getElementById('fDesc').value.trim() || '설명 없음';
    const vid = extractYoutubeId(urlRaw);
    const errEl = document.getElementById('fUrlErr');

    let camData;
    if(vid){
      camData = {
        name,
        lat: Number(pickedLatLng.lat.toFixed(6)),
        lng: Number(pickedLatLng.lng.toFixed(6)),
        videoId: vid,
        desc
      };
    } else if(/^https?:\/\//i.test(urlRaw)){
      // 표준 유튜브 영상 ID를 못 찾았지만 http(s) 링크는 맞음 → 리다이렉트/외부 링크로 저장
      camData = {
        name,
        lat: Number(pickedLatLng.lat.toFixed(6)),
        lng: Number(pickedLatLng.lng.toFixed(6)),
        externalUrl: urlRaw,
        desc
      };
    } else {
      errEl.classList.add('show');
      return;
    }
    errEl.classList.remove('show');

    const snippet = camData.videoId
      ? `{ name: "${name.replace(/"/g,'\\"')}", lat: ${camData.lat}, lng: ${camData.lng}, videoId: "${camData.videoId}", desc: "${desc.replace(/"/g,'\\"')}" },`
      : `{ name: "${name.replace(/"/g,'\\"')}", lat: ${camData.lat}, lng: ${camData.lng}, externalUrl: "${camData.externalUrl.replace(/"/g,'\\"')}", desc: "${desc.replace(/"/g,'\\"')}" },`;

    codeText.textContent = snippet;
    codeResult.classList.add('show');

    // 지금 화면에도 바로 미리보기 마커로 추가(새로고침하면 사라짐 — 실제 저장은 아래 코드를 복사해 파일에 붙여넣어야 함)
    addCamMarker(camData);
    cams.push(camData);
    updateCount();
  });

  btnCopy.addEventListener('click', async () => {
    try{
      await navigator.clipboard.writeText(codeText.textContent);
      btnCopy.textContent = '복사됨 ✓';
      btnCopy.classList.add('copied');
      setTimeout(() => { btnCopy.textContent = '코드 복사'; btnCopy.classList.remove('copied'); }, 1600);
    }catch(err){
      btnCopy.textContent = '복사 실패 — 직접 선택해 복사하세요';
    }
  });
</script>

</body>
</html>
