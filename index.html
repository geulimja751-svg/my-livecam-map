<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>라이브캠 지도 데모</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.css" />
<style>
  :root{
    --bg: #0a0e14;
    --panel: #10151d;
    --line: #1e2733;
    --text: #e8edf3;
    --text-dim: #7d8a9a;
    --accent: #4fb3ff;
    --accent-glow: rgba(79,179,255,0.55);
    --live-red: #ff4d5e;
    --cctv-color: #ffb020;
    --mono: 'SF Mono', 'Consolas', 'Menlo', monospace;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%; width:100%;
    background:var(--bg); color:var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Pretendard', 'Malgun Gothic', sans-serif;
    overflow:hidden;
  }
  #map{
    position:absolute; inset:0;
    background:var(--bg);
  }
  .leaflet-container{ background:var(--bg); }
  .dark-tiles{
    filter: invert(1) hue-rotate(180deg) brightness(0.85) contrast(0.9) saturate(0.6);
  }
  .topbar{
    position:absolute; top:0; left:0; right:0; z-index:1000;
    display:flex; align-items:center; gap:10px;
    padding:16px 18px;
    pointer-events:none;
    flex-wrap:wrap;
  }
  .brand{
    display:flex; flex-direction:column; gap:2px;
    pointer-events:auto;
  }
  .brand .kicker{
    font-family:var(--mono); font-size:10px; letter-spacing:0.18em;
    color:var(--accent); text-transform:uppercase;
  }
  .brand .title{
    font-size:15px; font-weight:600; color:var(--text);
    letter-spacing:-0.01em;
  }
  .count-pill{
    margin-left:auto; pointer-events:auto;
    background:var(--panel); border:1px solid var(--line);
    border-radius:20px; padding:7px 14px;
    font-family:var(--mono); font-size:11px; color:var(--text-dim);
    display:flex; align-items:center; gap:6px;
  }
  .count-pill b{ color:var(--text); font-weight:600; }
  .count-pill .dot{
    width:6px; height:6px; border-radius:50%;
    background:var(--live-red);
    box-shadow:0 0 6px var(--live-red);
    animation: blink 1.6s ease-in-out infinite;
  }
  @keyframes blink{ 0%,100%{opacity:1;} 50%{opacity:0.25;} }
  .cam-marker{
    width:20px; height:20px; border-radius:50%;
    background:var(--accent);
    border:2px solid #0a0e14;
    box-shadow:0 0 0 4px var(--accent-glow), 0 0 14px var(--accent-glow);
    cursor:pointer;
    transition: transform 0.15s ease;
  }
  .cam-marker:hover{ transform:scale(1.25); }
  .cam-marker.active{
    background:#ffb020;
    box-shadow:0 0 0 5px rgba(255,176,32,0.5), 0 0 18px rgba(255,176,32,0.6);
  }
  .cctv-marker{
    width:12px; height:12px; border-radius:50%;
    background:var(--cctv-color);
    border:1.5px solid #0a0e14;
    box-shadow:0 0 0 3px rgba(255,176,32,0.35), 0 0 8px rgba(255,176,32,0.5);
    cursor:pointer;
  }
  .cctv-marker.active{
    background:#ff4d5e;
    box-shadow:0 0 0 4px rgba(255,77,94,0.45), 0 0 10px rgba(255,77,94,0.6);
  }
  .marker-cluster-custom{
    background:rgba(255,176,32,0.25);
    border:1px solid rgba(255,176,32,0.6);
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    color:#0a0e14; font-weight:700; font-size:12px;
  }
  .marker-cluster-custom span{
    background:var(--cctv-color);
    width:100%; height:100%; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
  }
  .panel{
    position:absolute; z-index:1100;
    background:var(--panel);
    border:1px solid var(--line);
    box-shadow: 0 -8px 40px rgba(0,0,0,0.5);
    display:flex; flex-direction:column;
    transform: translateY(110%);
    transition: transform 0.32s cubic-bezier(.2,.9,.25,1);
  }
  @media (min-width: 720px){
    .panel{
      top:16px; right:16px; bottom:16px; width:380px;
      border-radius:14px; transform: translateX(120%);
    }
    .panel.open{ transform: translateX(0); }
  }
  @media (max-width: 719px){
    .panel{
      left:0; right:0; bottom:0; height:58%;
      border-radius:16px 16px 0 0;
    }
    .panel.open{ transform: translateY(0); }
  }
  .panel-head{
    display:flex; align-items:center; gap:10px;
    padding:14px 16px; border-bottom:1px solid var(--line);
    flex-shrink:0;
  }
  .live-badge{
    display:flex; align-items:center; gap:5px;
    background:rgba(255,77,94,0.12); border:1px solid rgba(255,77,94,0.35);
    color:var(--live-red); font-family:var(--mono); font-size:10px;
    font-weight:700; letter-spacing:0.08em;
    padding:3px 8px; border-radius:20px;
  }
  .live-badge .dot{
    width:5px; height:5px; border-radius:50%; background:var(--live-red);
    animation: blink 1.4s ease-in-out infinite;
  }
  .panel-title{
    font-size:14px; font-weight:600; flex:1;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .panel-close{
    background:none; border:none; color:var(--text-dim);
    font-size:18px; cursor:pointer; padding:4px 6px; line-height:1;
    border-radius:6px;
  }
  .panel-close:hover{ background:var(--line); color:var(--text); }
  .video-wrap{
    position:relative; width:100%; aspect-ratio:16/9;
    background:#000; flex-shrink:0;
  }
  .video-wrap iframe, .video-wrap video{
    position:absolute; inset:0; width:100%; height:100%; border:0;
  }
  .external-cta{
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:10px; padding:20px; text-align:center;
    background:linear-gradient(180deg,rgba(13,20,32,0.92),rgba(5,7,10,0.95));
    z-index:2;
  }
  .external-cta-icon{
    width:44px; height:44px; border-radius:50%;
    background:var(--accent); color:#0a0e14;
    display:flex; align-items:center; justify-content:center;
    font-size:16px;
  }
  .external-cta-text{ font-size:12.5px; color:var(--text-dim); }
  .external-cta-btn{
    margin-top:4px;
    background:var(--accent); color:#0a0e14;
    font-size:12.5px; font-weight:700;
    padding:9px 16px; border-radius:20px;
    text-decoration:none;
  }
  .external-cta-btn:hover{ filter:brightness(1.08); }
  .video-state{
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:8px; color:var(--text-dim); font-size:12.5px; text-align:center; padding:14px;
    background:#05070a;
  }
  .video-state .spin{
    width:22px; height:22px; border:2px solid var(--line); border-top-color:var(--accent);
    border-radius:50%; animation: sp 0.7s linear infinite;
  }
  @keyframes sp{ to{ transform:rotate(360deg); } }
  .panel-body{
    padding:14px 16px; overflow-y:auto;
    font-size:12.5px; color:var(--text-dim); line-height:1.6;
  }
  .panel-body .loc{ color:var(--text); font-weight:600; font-size:13px; margin-bottom:4px; }
  .panel-body .src{ font-family:var(--mono); font-size:10.5px; color:#4d5a6a; margin-top:8px; }
  .hint{
    position:absolute; left:50%; bottom:20px; transform:translateX(-50%);
    z-index:900; pointer-events:none;
    background:var(--panel); border:1px solid var(--line);
    padding:8px 14px; border-radius:20px;
    font-size:11.5px; color:var(--text-dim);
    opacity:1; transition:opacity 0.4s ease;
  }
  .hint.hidden{ opacity:0; }
  .leaflet-control-zoom{
    border:1px solid var(--line) !important;
    margin-top:70px !important;
  }
  .leaflet-control-zoom a{
    background:var(--panel) !important; color:var(--text) !important;
    border-color:var(--line) !important;
  }
  .leaflet-control-zoom a:hover{ background:var(--line) !important; }
  .leaflet-control-attribution{
    background:rgba(10,14,20,0.75) !important; color:var(--text-dim) !important;
    font-size:9px !important;
  }
  .leaflet-control-attribution a{ color:var(--accent) !important; }
  .style-switch{
    position:absolute; left:16px; bottom:20px; z-index:900;
    display:flex; gap:2px;
    background:var(--panel); border:1px solid var(--line);
    border-radius:12px; padding:3px;
    box-shadow:0 6px 24px rgba(0,0,0,0.4);
  }
  .style-switch button{
    appearance:none; border:none; background:transparent;
    color:var(--text-dim); font-size:11.5px; font-weight:600;
    padding:7px 12px; border-radius:9px; cursor:pointer;
    font-family:inherit; letter-spacing:-0.01em;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .style-switch button:hover{ color:var(--text); }
  .style-switch button.active{
    background:var(--accent); color:#0a0e14;
  }
  .add-btn{
    pointer-events:auto;
    display:flex; align-items:center; gap:6px;
    background:var(--panel); border:1px solid var(--line);
    color:var(--text); font-size:12px; font-weight:600;
    padding:8px 14px; border-radius:20px; cursor:pointer;
    font-family:inherit;
  }
  .add-btn:hover{ border-color:var(--accent); color:var(--accent); }
  .add-btn.active{
    background:var(--accent); color:#0a0e14; border-color:var(--accent);
  }
  #cctvBtn.active{
    background:var(--cctv-color); color:#0a0e14; border-color:var(--cctv-color);
  }
  #map.picking{ cursor:crosshair; }
  .pick-hint{
    position:absolute; top:64px; left:50%; transform:translateX(-50%);
    z-index:950; background:var(--accent); color:#0a0e14;
    font-size:12px; font-weight:600; padding:8px 16px; border-radius:20px;
    display:none; box-shadow:0 6px 20px rgba(79,179,255,0.35);
  }
  .pick-hint.show{ display:block; }
  .temp-marker{
    width:22px; height:22px; border-radius:50%;
    background:#ff8a1e; border:2px solid #0a0e14;
    box-shadow:0 0 0 5px rgba(255,138,30,0.45), 0 0 16px rgba(255,138,30,0.6);
  }
  .modal-overlay{
    position:absolute; inset:0; z-index:1300;
    background:rgba(5,7,10,0.55);
    display:none; align-items:center; justify-content:center;
    padding:20px;
  }
  .modal-overlay.show{ display:flex; }
  .modal-box{
    width:100%; max-width:380px;
    background:var(--panel); border:1px solid var(--line);
    border-radius:14px; padding:18px;
    box-shadow:0 20px 60px rgba(0,0,0,0.6);
  }
  .modal-box h3{
    margin:0 0 4px; font-size:15px; color:var(--text);
  }
  .modal-box .coord{
    font-family:var(--mono); font-size:11px; color:var(--text-dim); margin-bottom:14px;
  }
  .field{ margin-bottom:12px; }
  .field label{
    display:block; font-size:11.5px; color:var(--text-dim); margin-bottom:5px;
  }
  .field input, .field textarea{
    width:100%; background:#0a0e14; border:1px solid var(--line);
    color:var(--text); font-size:13px; padding:9px 10px;
    border-radius:8px; font-family:inherit; resize:none;
  }
  .field input:focus, .field textarea:focus{
    outline:none; border-color:var(--accent);
  }
  .field .err{ color:var(--live-red); font-size:11px; margin-top:5px; display:none; }
  .field .err.show{ display:block; }
  .modal-actions{
    display:flex; gap:8px; margin-top:4px;
  }
  .modal-actions button{
    flex:1; padding:10px; border-radius:8px; border:none;
    font-size:13px; font-weight:600; cursor:pointer; font-family:inherit;
  }
  .btn-cancel{ background:var(--line); color:var(--text-dim); }
  .btn-cancel:hover{ color:var(--text); }
  .btn-generate{ background:var(--accent); color:#0a0e14; }
  .btn-generate:hover{ filter:brightness(1.08); }
  .code-result{ margin-top:14px; display:none; }
  .code-result.show{ display:block; }
  .code-result pre{
    background:#05070a; border:1px solid var(--line); border-radius:8px;
    padding:10px; font-family:var(--mono); font-size:10.5px; color:#9fd6ff;
    white-space:pre-wrap; word-break:break-all; margin:0 0 8px;
    max-height:120px; overflow-y:auto;
  }
  .btn-copy{
    width:100%; background:transparent; border:1px solid var(--accent);
    color:var(--accent); padding:9px; border-radius:8px; font-size:12.5px;
    font-weight:600; cursor:pointer; font-family:inherit;
  }
  .btn-copy:hover{ background:rgba(79,179,255,0.1); }
  .btn-copy.copied{ background:var(--accent); color:#0a0e14; }
  .list-panel{
    position:absolute; z-index:1150;
    background:var(--panel); border:1px solid var(--line);
    display:flex; flex-direction:column;
    box-shadow: 8px 0 40px rgba(0,0,0,0.5);
    transform: translateX(-110%);
    transition: transform 0.3s cubic-bezier(.2,.9,.25,1);
  }
  @media (min-width: 720px){
    .list-panel{ top:16px; left:16px; bottom:16px; width:300px; border-radius:14px; }
    .list-panel.open{ transform:translateX(0); }
  }
  @media (max-width: 719px){
    .list-panel{ top:0; left:0; bottom:0; width:82%; max-width:320px; border-radius:0 16px 16px 0; }
    .list-panel.open{ transform:translateX(0); }
  }
  .list-head{
    display:flex; align-items:center; gap:8px;
    padding:14px 14px; border-bottom:1px solid var(--line); flex-shrink:0;
  }
  .list-head input{
    flex:1; background:#0a0e14; border:1px solid var(--line);
    color:var(--text); font-size:13px; padding:8px 10px; border-radius:8px;
    font-family:inherit;
  }
  .list-head input:focus{ outline:none; border-color:var(--accent); }
  .list-items{
    list-style:none; margin:0; padding:6px; overflow-y:auto; flex:1;
  }
  .list-items li{
    padding:9px 10px; border-radius:8px; cursor:pointer;
    font-size:13px; color:var(--text);
    display:flex; align-items:center; gap:8px;
  }
  .list-items li:hover{ background:var(--line); }
  .list-items li .tag{
    width:7px; height:7px; border-radius:50%; flex-shrink:0;
    background:var(--accent);
  }
  .list-items li.is-cctv .tag{ background:var(--cctv-color); }
  .list-items li .nm{ flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .list-empty{ padding:16px 12px; color:var(--text-dim); font-size:12px; text-align:center; }
</style>
</head>
<body>
<div id="map"></div>
<div class="topbar">
  <div class="brand">
    <div class="kicker">Live Cam Map · Demo</div>
    <div class="title">부산 실시간 카메라</div>
  </div>
  <button class="add-btn" id="listBtn">☰ 목록</button>
  <button class="add-btn" id="cctvBtn">📹 국도 CCTV</button>
  <button class="add-btn" id="addBtn">+ 카메라 추가</button>
  <div class="count-pill"><span class="dot"></span>등록 <b id="camCount">0</b>개</div>
</div>
<div class="pick-hint" id="pickHint">지도를 클릭해 카메라 위치를 선택하세요 (취소: 버튼 다시 클릭)</div>
<div class="hint" id="hint">지도 위 점을 눌러보세요</div>
<div class="style-switch" id="styleSwitch">
  <button data-style="dark" class="active">다크</button>
  <button data-style="clean">클린</button>
  <button data-style="satellite">위성</button>
</div>
<div class="list-panel" id="listPanel">
  <div class="list-head">
    <input type="text" id="listSearch" placeholder="카메라 이름 검색">
    <button class="panel-close" id="listClose">✕</button>
  </div>
  <ul class="list-items" id="listItems"></ul>
</div>
<div class="panel" id="panel">
  <div class="panel-head">
    <span class="live-badge"><span class="dot"></span>LIVE</span>
    <div class="panel-title" id="panelTitle">-</div>
    <button class="panel-close" id="panelClose">✕</button>
  </div>
  <div class="video-wrap" id="videoWrap"></div>
  <div class="panel-body">
    <div class="loc" id="panelLoc">-</div>
    <div id="panelDesc">-</div>
    <div class="src" id="panelSrc">-</div>
  </div>
</div>
<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box">
    <h3>카메라 추가</h3>
    <div class="coord" id="modalCoord">-</div>
    <div class="field">
      <label>이름</label>
      <input type="text" id="fName" placeholder="예: 해운대 해수욕장">
    </div>
    <div class="field">
      <label>영상 링크</label>
      <input type="text" id="fUrl" placeholder="유튜브 링크 또는 라이브 리다이렉트 링크(https://...)">
      <div class="err" id="fUrlErr">링크를 인식하지 못했어요. http(s)로 시작하는 주소인지 확인해주세요.</div>
    </div>
    <div class="field">
      <label>설명 (선택)</label>
      <textarea id="fDesc" rows="2" placeholder="예: 해운대 해변가 실시간 화면"></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" id="modalCancel">취소</button>
      <button class="btn-generate" id="modalGenerate">코드 생성</button>
    </div>
    <div class="code-result" id="codeResult">
      <pre id="codeText"></pre>
      <button class="btn-copy" id="btnCopy">코드 복사</button>
    </div>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.17/hls.min.js"></script>
<script>
  const cams = [
    { name: "부산항대교 전망",     lat: 35.1046, lng: 129.0768, videoId: "jfKfPfyJRdk", desc: "부산항대교 인근 상시 라이브 스트림 예시" },
    { name: "광안대교 야경",       lat: 35.1533, lng: 129.1186, videoId: "jfKfPfyJRdk", desc: "광안대교 방면 라이브캠 예시 지점" },
    { name: "해운대 해수욕장",     lat: 35.1587, lng: 129.1604, videoId: "LGuktGeHQxI", desc: "해운대 해변가 실시간 화면 예시" },
    { name: "송정 해변",           lat: 35.1785, lng: 129.2005, videoId: "jfKfPfyJRdk", desc: "송정 해수욕장 라이브 예시" },
    { name: "기장 오시리아",       lat: 35.1963, lng: 129.2287, videoId: "jfKfPfyJRdk", desc: "기장군 해안 도로변 예시" },
    { name: "동백섬",              lat: 35.1547, lng: 129.1518, videoId: "jfKfPfyJRdk", desc: "동백섬 산책로 예시 지점" },
    { name: "오사카성", lat: 34.687445, lng: 135.52578, externalUrl: "https://www.youtube.com/@tvosakanews/live", desc: "오사카성" },
    { name: "광안리 라이브", lat: 35.1530, lng: 129.1180, externalUrl: "https://geulimja751-svg.github.io/live-redirect/?channel=@GiGAeyesLiveTV&keyword=%EA%B4%91%EC%95%88%EB%A6%AC", desc: "광안리 실시간 (리다이렉트 테스트)" },
  ];
  const map = L.map('map', {
    zoomControl: true,
    attributionControl: true,
    minZoom: 3,
    maxZoom: 20,
  }).setView([35.16, 129.15], 12);
  const styles = {
    dark: {
      url: 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
      options: { attribution: '&copy; OpenStreetMap contributors', subdomains: 'abc', maxZoom: 19, className: 'dark-tiles' }
    },
    clean: {
      url: 'https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',
      options: { attribution: '&copy; OpenStreetMap &copy; CARTO', subdomains: 'abcd', maxZoom: 20 }
    },
    satellite: {
      url: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
      options: { attribution: 'Imagery &copy; Esri', maxZoom: 19 }
    }
  };
  let tileLayer = L.tileLayer(styles.dark.url, styles.dark.options).addTo(map);
  let currentStyle = 'dark';
  function switchStyle(name){
    if(name === currentStyle) return;
    map.removeLayer(tileLayer);
    tileLayer = L.tileLayer(styles[name].url, styles[name].options).addTo(map);
    currentStyle = name;
    document.querySelectorAll('#styleSwitch button').forEach(b =>
      b.classList.toggle('active', b.dataset.style === name)
    );
    checkTileLoad();
  }
  document.getElementById('styleSwitch').addEventListener('click', e => {
    const btn = e.target.closest('button');
    if(btn) switchStyle(btn.dataset.style);
  });
  function checkTileLoad(){
    document.getElementById('tileWarn')?.remove();
    let loaded = false;
    tileLayer.once('load', () => { loaded = true; document.getElementById('tileWarn')?.remove(); });
    setTimeout(() => {
      if(!loaded){
        const warn = document.createElement('div');
        warn.id = 'tileWarn';
        warn.style.cssText = 'position:absolute;top:70px;left:50%;transform:translateX(-50%);z-index:900;background:#10151d;border:1px solid #1e2733;color:#7d8a9a;font-size:11px;padding:8px 14px;border-radius:20px;max-width:80%;text-align:center;';
        warn.textContent = '이 스타일은 미리보기 창에서 로드가 막힐 수 있어요 — 실제 배포 환경에서는 정상 표시됩니다';
        document.body.appendChild(warn);
      }
    }, 3500);
  }
  checkTileLoad();
  const panel = document.getElementById('panel');
  const hint = document.getElementById('hint');
  let activeMarker = null;
  let activeHls = null;
  const camMarkers = new Map();
  function stopVideo(){
    if(activeHls){ try{ activeHls.destroy(); }catch(e){} activeHls = null; }
    document.getElementById('videoWrap').innerHTML = '';
  }
  function openCam(cam, marker){
    if(activeMarker) activeMarker.getElement()?.classList.remove('active');
    activeMarker = marker;
    marker.getElement()?.classList.add('active');
    stopVideo();
    document.getElementById('panelTitle').textContent = cam.name;
    document.getElementById('panelLoc').textContent = cam.name;
    document.getElementById('panelDesc').textContent = cam.desc;
    const videoWrap = document.getElementById('videoWrap');
    const panelSrc = document.getElementById('panelSrc');
    if(cam.videoId){
      panelSrc.textContent = `source: youtube.com/watch?v=${cam.videoId}`;
      videoWrap.innerHTML =
        `<iframe src="https://www.youtube.com/embed/${cam.videoId}?autoplay=1&mute=1"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
          allowfullscreen></iframe>`;
    } else if(cam.externalUrl){
      panelSrc.textContent = `source: ${cam.externalUrl}`;
      // 시도: iframe으로 넣고, 안 되면 CTA 표시
      videoWrap.innerHTML = `
        <iframe id="extFrame"
          src="${cam.externalUrl}"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
          allowfullscreen
          style="position:absolute;inset:0;width:100%;height:100%;border:0;background:#000"></iframe>
        <div class="external-cta" id="extCta" style="display:none">
          <div class="external-cta-icon">▶</div>
          <div class="external-cta-text">패널에서 바로 재생이 안 될 수 있어요</div>
          <a class="external-cta-btn" href="${cam.externalUrl}" target="_blank" rel="noopener noreferrer">새 탭에서 라이브 보기 ↗</a>
        </div>
      `;
      // 3초 뒤 CTA를 보여줌 (유튜브가 막으면 검은 화면이 나오므로)
      setTimeout(() => {
        const cta = document.getElementById('extCta');
        if(cta) cta.style.display = 'flex';
      }, 3000);
    }
    panel.classList.add('open');
    hint.classList.add('hidden');
  }
  function closeCam(){
    panel.classList.remove('open');
    stopVideo();
    if(activeMarker) activeMarker.getElement()?.classList.remove('active');
    activeMarker = null;
  }
  document.getElementById('panelClose').addEventListener('click', closeCam);
  const camCountEl = document.getElementById('camCount');
  function addCamMarker(cam){
    const icon = L.divIcon({ className: 'cam-marker', iconSize: [20,20] });
    const marker = L.marker([cam.lat, cam.lng], { icon }).addTo(map);
    marker.on('click', () => openCam(cam, marker));
    camMarkers.set(cam, marker);
    return marker;
  }
  function updateCount(){
    camCountEl.textContent = cams.length + (cctvOn ? cctvLayer.getLayers().length : 0);
    if(listPanel.classList.contains('open')) renderList(listSearch.value);
  }
  cams.forEach(addCamMarker);

  const ITS_API_KEY = 'f9565bfc1f2b4a68a26c48120f5c27b3	';
  const ITS_ENDPOINT = 'https://openapi.its.go.kr:9443/cctvInfo';
  const ITS_MIN_ZOOM = 11;
  let cctvOn = false;
  let cctvLoading = false;
  const cctvLayer = L.markerClusterGroup({
    maxClusterRadius: 50,
    disableClusteringAtZoom: 15,
    iconCreateFunction: cluster => L.divIcon({
      html: `<span>${cluster.getChildCount()}</span>`,
      className: 'marker-cluster-custom',
      iconSize: [36, 36],
    }),
  });
  function itsUrl(bounds){
    const p = new URLSearchParams({
      apiKey: ITS_API_KEY,
      type: 'all',
      cctvType: '1',
      minX: bounds.getWest(),
      maxX: bounds.getEast(),
      minY: bounds.getSouth(),
      maxY: bounds.getNorth(),
      getType: 'json',
    });
    return `${ITS_ENDPOINT}?${p.toString()}`;
  }
  async function loadCctvInView(){
    if(!cctvOn || cctvLoading) return;
    if(map.getZoom() < ITS_MIN_ZOOM){
      cctvLayer.clearLayers();
      updateCount();
      return;
    }
    cctvLoading = true;
    try{
      const res = await fetch(itsUrl(map.getBounds()));
      if(!res.ok) throw new Error('http ' + res.status);
      const data = await res.json();
      const list = (data.response && data.response.data) || [];
      cctvLayer.clearLayers();
      list.forEach(c => {
        if(!c.coordy || !c.coordx) return;
        const icon = L.divIcon({ className: 'cctv-marker', iconSize: [12,12] });
        const marker = L.marker([c.coordy, c.coordx], { icon });
        marker.on('click', () => openCctv(c, marker));
        cctvLayer.addLayer(marker);
      });
      updateCount();
    }catch(e){
      console.warn('ITS CCTV 로드 실패 (API 키 미설정이거나 CORS 문제일 수 있음):', e.message);
    }finally{
      cctvLoading = false;
    }
  }
  function openCctv(c, marker){
    if(activeMarker) activeMarker.getElement()?.classList.remove('active');
    activeMarker = marker;
    marker.getElement()?.classList.add('active');
    stopVideo();
    document.getElementById('panelTitle').textContent = c.cctvname || 'CCTV';
    document.getElementById('panelLoc').textContent = c.cctvname || '-';
    document.getElementById('panelDesc').textContent =
      (c.roadsectionid ? `구간: ${c.roadsectionid}` : '국가교통정보센터 실시간 CCTV');
    document.getElementById('panelSrc').textContent = 'source: 국가교통정보센터(ITS)';
    const videoWrap = document.getElementById('videoWrap');
    videoWrap.innerHTML = '<div class="video-state" id="cctvState"><div class="spin"></div><div>불러오는 중…</div></div>';
    if(!c.cctvurl){
      videoWrap.innerHTML = '<div class="video-state">이 카메라는 스트림 주소가 없습니다</div>';
    }else{
      videoWrap.innerHTML += '<video id="cctvVideo" muted playsinline></video>';
      const video = document.getElementById('cctvVideo');
      const state = document.getElementById('cctvState');
      if(window.Hls && Hls.isSupported()){
        activeHls = new Hls();
        activeHls.loadSource(c.cctvurl);
        activeHls.attachMedia(video);
        activeHls.on(Hls.Events.MANIFEST_PARSED, () => { state?.remove(); video.play().catch(()=>{}); });
        activeHls.on(Hls.Events.ERROR, (_, d) => {
          if(d.fatal) videoWrap.innerHTML = '<div class="video-state">이 카메라는 지금 재생할 수 없습니다</div>';
        });
      }else if(video.canPlayType('application/vnd.apple.mpegurl')){
        video.src = c.cctvurl;
        video.addEventListener('loadedmetadata', () => state?.remove());
        video.play().catch(()=>{});
      }else{
        videoWrap.innerHTML = '<div class="video-state">이 브라우저에서는 재생할 수 없습니다</div>';
      }
    }
    panel.classList.add('open');
    hint.classList.add('hidden');
  }
  function toggleCctv(){
    cctvOn = !cctvOn;
    document.getElementById('cctvBtn').classList.toggle('active', cctvOn);
    if(cctvOn){
      map.addLayer(cctvLayer);
      loadCctvInView();
    }else{
      map.removeLayer(cctvLayer);
      cctvLayer.clearLayers();
      updateCount();
    }
  }
  document.getElementById('cctvBtn').addEventListener('click', toggleCctv);
  map.on('moveend', () => { if(cctvOn) loadCctvInView(); });
  const listPanel = document.getElementById('listPanel');
  const listItems = document.getElementById('listItems');
  const listSearch = document.getElementById('listSearch');
  function renderList(filterText){
    const q = (filterText || '').trim().toLowerCase();
    listItems.innerHTML = '';
    let count = 0;
    cams.filter(c => !q || c.name.toLowerCase().includes(q)).forEach(c => {
      const li = document.createElement('li');
      li.innerHTML = `<span class="tag"></span><span class="nm">${c.name}</span>`;
      li.addEventListener('click', () => {
        map.flyTo([c.lat, c.lng], 15, { duration: 0.6 });
        const marker = camMarkers.get(c);
        if(marker) openCam(c, marker);
        listPanel.classList.remove('open');
      });
      listItems.appendChild(li);
      count++;
    });
    if(cctvOn){
      cctvLayer.eachLayer(marker => {
        const ll = marker.getLatLng();
        const name = marker._cctvName || 'CCTV';
        if(q && !name.toLowerCase().includes(q)) return;
        const li = document.createElement('li');
        li.className = 'is-cctv';
        li.innerHTML = `<span class="tag"></span><span class="nm">${name}</span>`;
        li.addEventListener('click', () => {
          map.flyTo(ll, Math.max(map.getZoom(), 15), { duration: 0.6 });
          marker.fire('click');
          listPanel.classList.remove('open');
        });
        listItems.appendChild(li);
        count++;
      });
    }
    if(!count){
      listItems.innerHTML = '<li class="list-empty" style="cursor:default">검색 결과가 없습니다</li>';
    }
  }
  document.getElementById('listBtn').addEventListener('click', () => {
    listPanel.classList.toggle('open');
    if(listPanel.classList.contains('open')) renderList(listSearch.value);
  });
  document.getElementById('listClose').addEventListener('click', () => listPanel.classList.remove('open'));
  listSearch.addEventListener('input', () => renderList(listSearch.value));
  const addBtn = document.getElementById('addBtn');
  const pickHint = document.getElementById('pickHint');
  const mapEl = document.getElementById('map');
  const modalOverlay = document.getElementById('modalOverlay');
  const modalCoord = document.getElementById('modalCoord');
  const codeResult = document.getElementById('codeResult');
  const codeText = document.getElementById('codeText');
  const btnCopy = document.getElementById('btnCopy');
  let pickMode = false;
  let pickedLatLng = null;
  let tempMarker = null;
  function togglePickMode(force){
    pickMode = force !== undefined ? force : !pickMode;
    addBtn.classList.toggle('active', pickMode);
    pickHint.classList.toggle('show', pickMode);
    mapEl.classList.toggle('picking', pickMode);
  }
  addBtn.addEventListener('click', () => togglePickMode());
  map.on('click', (e) => {
    if(!pickMode) return;
    pickedLatLng = e.latlng;
    if(tempMarker) map.removeLayer(tempMarker);
    tempMarker = L.marker(e.latlng, { icon: L.divIcon({ className:'temp-marker', iconSize:[22,22] }) }).addTo(map);
    modalCoord.textContent = `위도 ${e.latlng.lat.toFixed(6)}, 경도 ${e.latlng.lng.toFixed(6)}`;
    document.getElementById('fName').value = '';
    document.getElementById('fUrl').value = '';
    document.getElementById('fDesc').value = '';
    document.getElementById('fUrlErr').classList.remove('show');
    codeResult.classList.remove('show');
    modalOverlay.classList.add('show');
    togglePickMode(false);
  });
  function extractYoutubeId(input){
    input = input.trim();
    if(/^[a-zA-Z0-9_-]{11}$/.test(input)) return input;
    const patterns = [
      /(?:youtube\.com\/watch\?v=)([a-zA-Z0-9_-]{11})/,
      /(?:youtu\.be\/)([a-zA-Z0-9_-]{11})/,
      /(?:youtube\.com\/live\/)([a-zA-Z0-9_-]{11})/,
      /(?:youtube\.com\/embed\/)([a-zA-Z0-9_-]{11})/,
      /[?&]v=([a-zA-Z0-9_-]{11})/,
    ];
    for(const re of patterns){
      const m = input.match(re);
      if(m) return m[1];
    }
    return null;
  }
  document.getElementById('modalCancel').addEventListener('click', closeModal);
  function closeModal(){
    modalOverlay.classList.remove('show');
    if(tempMarker){ map.removeLayer(tempMarker); tempMarker = null; }
  }
  document.getElementById('modalGenerate').addEventListener('click', () => {
    const name = document.getElementById('fName').value.trim() || '이름 없는 카메라';
    const urlRaw = document.getElementById('fUrl').value.trim();
    const desc = document.getElementById('fDesc').value.trim() || '설명 없음';
    const vid = extractYoutubeId(urlRaw);
    const errEl = document.getElementById('fUrlErr');
    let camData;
    if(vid){
      camData = {
        name,
        lat: Number(pickedLatLng.lat.toFixed(6)),
        lng: Number(pickedLatLng.lng.toFixed(6)),
        videoId: vid,
        desc
      };
    } else if(/^https?:\/\//i.test(urlRaw)){
      camData = {
        name,
        lat: Number(pickedLatLng.lat.toFixed(6)),
        lng: Number(pickedLatLng.lng.toFixed(6)),
        externalUrl: urlRaw,
        desc
      };
    } else {
      errEl.classList.add('show');
      return;
    }
    errEl.classList.remove('show');
    const snippet = camData.videoId
      ? `{ name: "${name.replace(/"/g,'\\"')}", lat: ${camData.lat}, lng: ${camData.lng}, videoId: "${camData.videoId}", desc: "${desc.replace(/"/g,'\\"')}" },`
      : `{ name: "${name.replace(/"/g,'\\"')}", lat: ${camData.lat}, lng: ${camData.lng}, externalUrl: "${camData.externalUrl.replace(/"/g,'\\"')}", desc: "${desc.replace(/"/g,'\\"')}" },`;
    codeText.textContent = snippet;
    codeResult.classList.add('show');
    addCamMarker(camData);
    cams.push(camData);
    updateCount();
  });
  btnCopy.addEventListener('click', async () => {
    try{
      await navigator.clipboard.writeText(codeText.textContent);
      btnCopy.textContent = '복사됨 ✓';
      btnCopy.classList.add('copied');
      setTimeout(() => { btnCopy.textContent = '코드 복사'; btnCopy.classList.remove('copied'); }, 1600);
    }catch(err){
      btnCopy.textContent = '복사 실패 — 직접 선택해 복사하세요';
    }
  });

  updateCount();
</script>
</body>
</html>
